<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title id="gameTitle">长生梦录</title>
<style>
/* 主题化 skin：颜色全部走 CSS 变量（默认 = 仙侠·山水皮肤），切换主题时由 novel.js applyTheme() 注入 :root */
:root{
  --bg:#f6f1e5; --bg-face:#faf6ec; --ink:#2f2a24; --ink-soft:#3a332a;
  --border:#c9bfa8; --border-soft:#ddd2bc; --panel:#efe8d8; --panel-light:#fbf8f0;
  --gold:#8a6d3b; --seal:#a63d2f; --green:#5b7a5d; --blue:#4a6b6a;
  --btn-border:#a89b7f; --hp-empty:#d8d0bc; --sub-text:#6b6255;
  --glow1:rgba(90,122,93,0.10); --glow2:rgba(74,107,106,0.10); --shadow:rgba(60,50,30,0.12);
  --mtn1:#5b7a5d; --mtn2:#4a6b6a; --mtn3:#a63d2f;
}
*{box-sizing:border-box;font-family:"KaiTi","STKaiti","SimSun","Microsoft Yahei",sans-serif;}
body{background:var(--bg);color:var(--ink);padding:20px;max-width:1200px;margin:0 auto;height:100vh;overflow:hidden;
  background-image:radial-gradient(ellipse at 18% 8%, var(--glow1), transparent 55%),
                   radial-gradient(ellipse at 88% 92%, var(--glow2), transparent 55%);}
#layout{display:flex;gap:14px;height:100%;}
#gamebox{background:var(--bg-face);padding:24px;border-radius:10px;border:1px solid var(--border);
  box-shadow:0 4px 18px var(--shadow);
  flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.scroll-area{flex:1;overflow-y:auto;min-height:0;}
.title{color:var(--gold);font-size:24px;font-weight:bold;margin-bottom:12px;
  font-family:"STKaiti","KaiTi","SimSun",serif;letter-spacing:2px;
  display:flex;align-items:center;gap:10px;}
.seal{display:inline-block;background:var(--seal);color:var(--bg-face);font-size:13px;
  padding:3px 7px;border-radius:3px;font-family:"KaiTi",serif;letter-spacing:1px;
  box-shadow:inset 0 0 0 1px rgba(250,246,236,0.45);}
.mountain{flex-shrink:0;margin-left:auto;opacity:0.75;}
.info-bar{display:flex;gap:18px;margin:10px 0;padding:10px 12px;background:var(--panel);border:1px solid var(--border-soft);border-radius:6px;font-size:14px;flex-wrap:wrap;color:var(--ink-soft);}
.log{min-height:240px;padding:14px;background:var(--panel-light);border:1px solid var(--border-soft);border-radius:6px;margin:14px 0;white-space:pre-wrap;line-height:1.7;font-size:15px;color:var(--ink);}
.opt{margin:8px 0;}
button{width:100%;padding:11px;margin:5px 0;background:var(--bg);color:var(--ink);border:1px solid var(--btn-border);border-radius:6px;font-size:15px;cursor:pointer;text-align:left;font-family:"KaiTi","STKaiti","SimSun",serif;transition:all .2s ease;}
button:hover{background:var(--green);color:var(--bg-face);border-color:var(--green);}
.btnsmall{width:auto;padding:6px 12px;margin-right:6px;}
.ach{color:var(--green);}
.danger{color:var(--seal);}
.gold{color:var(--gold);}
.blue{color:var(--blue);}
.red{color:var(--seal);}
.green{color:var(--green);}
#equipbox,#achbox,#fightui{margin:12px 0;padding:10px 12px;background:var(--panel);border:1px solid var(--border-soft);border-radius:6px;font-size:14px;color:var(--ink-soft);}
#portraitbox{display:flex;flex-direction:column;gap:6px;margin:8px 0;overflow:hidden;}
#portraitToggle{flex-shrink:0;width:auto;padding:4px 10px;margin:0;}
#portraitwrap{display:flex;flex-direction:row-reverse;gap:14px;align-items:flex-start;transition:transform .35s ease;}
#portraitwrap.collapsed{transform:translateX(110%);}
#portraitimg{max-height:230px;max-width:220px;flex-shrink:0;border-radius:8px;border:1px solid var(--border);box-shadow:0 2px 10px var(--shadow);}
#portraitlabel{flex:1;color:var(--gold);font-size:14px;letter-spacing:1px;line-height:1.7;white-space:pre-wrap;}
.hpbar{width:100%;height:14px;background:var(--hp-empty);border-radius:4px;margin:4px 0;overflow:hidden;border:1px solid var(--border);}
.hpinner{height:100%;background:var(--seal);}

/* 侧栏功能面板（常驻，与剧情下一步选择分离）*/
#sidepanel{width:170px;flex-shrink:0;background:var(--panel);border:1px solid var(--border-soft);border-radius:8px;
  padding:10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
.side-title{color:var(--gold);font-size:14px;font-weight:bold;letter-spacing:2px;text-align:center;margin-bottom:2px;}
.side-divider{border:none;border-top:1px solid var(--border-soft);margin:4px 0;}
.sidebtn{width:100%;padding:8px 10px;margin:0;font-size:13px;background:var(--bg);color:var(--ink);
  border:1px solid var(--btn-border);border-radius:5px;cursor:pointer;text-align:center;font-family:"KaiTi","STKaiti","SimSun",serif;transition:all .2s ease;}
.sidebtn:hover{background:var(--green);color:var(--bg-face);border-color:var(--green);}
.sidebtn.home{background:var(--seal);color:var(--bg-face);border-color:var(--seal);}
.sidebtn.home:hover{background:var(--seal);color:var(--bg-face);}
/* c187（2026-09-06）：按方案仅取「焦点底线+动效豁免」两件——叙事沉浸皮肤不变 */
button:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>

<div id="gamebox">

<span class="ufield attr" data-k="heart"><span class="ulabel">☯道心</span>：<span id="attr-heart">0</span></span>

<div id="equipbox">🎒装备：<span id="equip">无</span></div>
<div id="achbox">🏆成就：<span id="achtext">暂无</span></div>
<div id="fightui" style="display:none;">
<div>⚔️战斗界面</div>
<div>敌方：<span id="enemyName"></span></div>
<div class="hpbar"><div id="enemyHpBar" class="hpinner"></div></div>

</div>
<div id="portraitbox" style="display:none;overflow:hidden;">
<button id="portraitToggle" class="btnsmall" style="flex-shrink:0;width:auto;padding:4px 10px;margin:0 0 6px 0;" onclick="togglePortrait()">➖ 收起插图</button>
<div id="portraitwrap" class="collapsed" style="display:flex;gap:14px;align-items:flex-start;transition:transform .35s ease;">
  <img id="portraitimg" alt="">
  <div id="portraitlabel"></div>
</div>
</div>
<div class="scroll-area">
<div class="log" id="logbox"></div>
<div id="optbox"></div>
</div>
</div>

<div id="sidepanel">
<div class="side-title">☰ 功能</div>
<div id="sidebtns"></div>
<hr class="side-divider">
<button class="sidebtn home" data-k="home" onclick="mainStep0()">🏠返回主线</button>
</div>
</div>

<script>

<script>
//==== data/quests.js：任务配置表（内容层 SSOT，P4 任务系统）====
// kind: main=主线（进入对应路线自动接取）/ side=支线 / loop=循环（完成后重置为 active）

// steps: [{desc, cond(可空), reward(可空)}]；onDone: {flags, items, rep, cult, stone, attrs, unlockQuest}
// 引擎只解释（quest.js），条件一律走 checkCond（D4 唯一门控）
const QUESTS={
 // ---- 主线 ×5（对应五条路线）----
 "q_main_hide":{
  name:"隐世问道",kind:"main",need:null,
  steps:[

const NPCS={
 //==== A 档：落魄老修士（灵魂领域：临终不索财/不夺后辈机缘/欠债必还/不对将死之人说谎）====
 "lao_xiu":{
  name:"落魄老修士",faction:"散修盟",desc:"寿元将尽，看出你长生特质",need:null,lifespan:30,
  dialogue:{
   "start":{
    text:"路边一位寿元将尽的老修士拦住你。他咳嗽了两声，像破风箱漏气：「咳……小友，你身上……有长生的气息。」",
    options:[
     {text:"问他：何出此言？",effect:{flags:{foreshadow_changsheng:true}},next:"ask"},
     {text:"老友叙旧（好感≥20）",need:{type:"relation",key:"lao_xiu",op:">=",val:20},next:"confide"},
     {text:"与他谈起你这些年走过的路（阅历≥3）",need:{type:"memory",op:">=",val:3},next:"memtalk"},
     {text:"婉言拒绝，径直离开",next:"end"}
    ]
   },
   "memtalk":{
    text:"老修士听你说完，又咳了一声：「老朽活了两百年，见过的路，比你走过的还多。可你走的这条……不一样。」他顿了顿，「你记住，长生不是熬出来的，是活明白的。你这一路，没白走。」",
    options:[{text:"拜谢老修士",effect:{cult:150,relation:{lao_xiu:20}},next:"end"}]
   },
   "ask":{
    text:"老修士眯起眼，又咳了一声：「老朽活了快两百年，见过的人多了。你这种……是熬出来的命。」他顿了顿，「老朽这把年纪，活到头了，就想找个人，把话说完。」",
    options:[
     {text:"倾听教诲，赠灵石50换取感悟",need:{type:"attr",key:"stone",op:">=",val:50},effect:{stone:-50,cult:80,relation:{lao_xiu:10}},next:"teach"},
     {text:"注意到他腰间的褪色玉牌，问起来历",effect:{flags:{foreshadow_yupai:true}},next:"yupai"},
     {text:"婉言拒绝，径直离开",next:"end"}
    ]
   },
   "yupai":{
    text:"老修士低头看了一眼腰间的玉牌，沉默了很久：「旧物，不提也罢。」他咳嗽得更厉害了，「……你要是真想知道，等哪天，你活够了再说。」",
    options:[
     {text:"不再追问，倾听教诲",need:{type:"attr",key:"stone",op:">=",val:50},effect:{stone:-50,cult:80,relation:{lao_xiu:10}},next:"teach"},
     {text:"拜别老修士",next:"end"}
    ]
   },
   "confide":{
    text:"老修士这次没有咳嗽。他看了你很久，忽然开口：「老朽年轻时，见过一个和你一样的人。那人也熬过了很多年，最后……把一样东西，托付给了老朽。」他低头看腰间的玉牌，「就是它。」",
    options:[
     {text:"问他：那人是长生者吗（好感≥50）",need:{type:"relation",key:"lao_xiu",op:">=",val:50},effect:{flags:{foreshadow_yupai:true}},next:"bequeath"},
     {text:"不再追问，倾听教诲",need:{type:"attr",key:"stone",op:">=",val:50},effect:{stone:-50,cult:80,relation:{lao_xiu:10}},next:"teach"},
     {text:"拜别老修士",next:"end"}
    ]
   },
   "bequeath":{
    text:"老修士沉默了很久，把腰间的玉牌解下来，递到你面前：「老朽守了一辈子，没等到能认出它的人。你……或许可以。」他咳了一声，「别学老朽，守着一样东西过一辈子。该放手时，就放手。」",

     {text:"郑重接过玉牌",effect:{flags:{foreshadow_yupai:true,foreshadow_yupai_got:true},relation:{lao_xiu:20}},next:"end"}
    ]
   },
   "teach":{
    text:"老修士将毕生感悟倾囊相授。他说得很慢，一句是一句：「长生不是熬出来的，是……活明白的。别学老朽，活了一辈子，最后才发现，最该珍惜的，早就没了。」",
    options:[{text:"拜别老修士",effect:{relation:{lao_xiu:10}},next:"end"}]
   },
   "end":{text:"你与老修士作别。他站在路边，望着你的背影，又咳了一声。",options:[]}
  }

 //==== B 档：凡间女子·阿蛮（灵魂领域：知恩必报/认定的事拉不回/不拖累恩人）====

  dialogue:{
   "start":{
    text:"阿蛮站在村口，攥着腕上的红绳，看见你时眼睛亮了一下，又低下头：「恩公……」",

   "memtalk":{
    text:"阿蛮睁大眼睛听完，攥着腕上的红绳：「恩公……原来恩公是这样的人。妾身只知道恩公救过妾身，却不知恩公也曾在刀尖上走过。」她低下头，「妾身……更敬重恩公了。」",
    options:[{text:"摸摸她的头",effect:{relation:{fan_nv:10}},next:"end"}]
   },
   "ask":{
    text:"阿蛮抬起头，努力笑了笑：「妾身……挺好的。就是，总想着恩公的恩情，还没还清。」她顿了顿，「妾身这条命，是恩公给的。」",
    options:[
     {text:"相伴共度一段岁月（凡人寿命短暂）",effect:{relation:{fan_nv:20},year:60},next:"accompany"},
     {text:"告诉她：不必挂怀，好好活着",effect:{relation:{fan_nv:10}},next:"end"}
    ]
   },
   "confide":{
    text:"阿蛮坐在村口的石头上，看着远处的山：「妾身最近总在想，恩公这样的人，是不是活得很累。」她低头摆弄腕上的红绳，「妾身这辈子，能遇见恩公，值了。可妾身……怕恩公有一天，连妾身叫什么，都忘了。」",
    options:[
     {text:"告诉她：不会忘",effect:{relation:{fan_nv:20}},next:"end"},
     {text:"告诉她：长生无情，忘与不忘都一样",effect:{relation:{fan_nv:-10}},next:"end"}
    ]
   },
   "accompany":{
    text:"你们相伴数十载。阿蛮老了，头发白了，笑起来眼睛还是弯成月牙。她走的那天，攥着你的手：「恩公……妾身这辈子，值了。」你把她葬在山坡上，种了一棵桃树。",
    options:[{text:"目送故人逝去，继续踏上长生旅途",effect:{relation:{fan_nv:30}},next:"end"}]
   },
   "disciple":{
    text:"阿蛮怔了很久，忽然跪下：「恩公若不嫌弃，妾身愿拜在恩公门下，学那长生之法。妾身这条命是恩公给的，往后，也想替恩公做点什么。」她攥着腕上的红绳，「妾身不怕苦。」",
    options:[
     {text:"收她为徒，传她吐纳之法",effect:{relation:{fan_nv:30},disciple:{name:"阿蛮",talent:"中上"}},next:"accept"},
     {text:"婉拒：长生路上太寂寞，不必再添一人",effect:{relation:{fan_nv:-5}},next:"end"}
    ]
   },
   "accept":{
    text:"你扶起阿蛮，传她吐纳之法。她学得很慢，但很认真，夜里还在村口对着月亮比划。你忽然觉得，这漫长的岁月，好像有了一点盼头。",
    options:[{text:"师徒相称，共度岁月",effect:{flags:{disciple_fan_nv_done:true}},next:"end"}]
   },
   "end":{text:"阿蛮望着你离去的背影，把红绳又系紧了一些。",options:[]}
  }
 },

//==== 存档读档 localstorage ====
function saveGame(){
 if(localStorage.getItem("mud_save")&&!confirm("已有旧存档，确定覆盖保存？"))return;
 // 运行时字段不落档（H 修复：战斗中存档→读档后幽灵敌人攻击）
 let snap=Object.assign({},gs);
 delete snap.inFight;delete snap.enemy;delete snap.foes;delete snap.aiEnabled;
 snap.inFight=false;snap.enemy=null;snap.foes=null;
 let saveData={gs:snap,allAch:allAch};
 localStorage.setItem("mud_save",JSON.stringify(saveData));
 log("✅游戏已保存至本地浏览器存档");
}
function loadGame(){
 let s=localStorage.getItem("mud_save");
 if(!s){log("⚠没有找到存档");return;}
 let d;
 try{d=JSON.parse(s);}catch(e){log("⚠存档数据损坏，无法读取（可清除存档后重开）","red");return;}
 if(!d||typeof d!=="object"||!d.gs||typeof d.gs!=="object"){log("⚠存档结构异常，无法读取","red");return;}
 _applySaveData(d);
}
//读档共用落地（单槽/槽位/最近档共用：迁移+运行时字段兜底+路由）
function _applySaveData(d){
 gs=d.gs;
 migrateSave();
 // 旧档残留运行时字段兜底清空（防幽灵战斗）
 gs.inFight=false;gs.enemy=null;gs.foes=null;
 Object.assign(allAch,d.allAch||{});
 renderAch();
 refreshUi();
 log("✅存档读取成功！");
 clearOpt();
 routeByStep();
}

//==== J35 体验轮·多槽位存档（用户 2026-08-23 定向：存/读做弹出窗口+多档位）====
// 槽位键 mud_save_slot_{1..6}（旧单槽 mud_save 保留兼容，作「继续上次存档」回落源）
const SAVE_SLOTS=6;
function _slotKey(n){return "mud_save_slot_"+n;}
function _slotMeta(){
 let r={time:new Date().toLocaleString()};
 try{
  r.year=gs.year;r.ng=gs.ng||1;r.endType=gs.endType||0;
  r.realm=realmOf(gs.cult).name;r.talent=gs.talent||"";
 }catch(_){}
 return r;
}
function slotInfo(n){
 let s=localStorage.getItem(_slotKey(n));
 if(!s)return {empty:true};
 try{let d=JSON.parse(s);return {empty:false,meta:d.meta||{}};}
 catch(_){return {empty:false,meta:{},broken:true};}
}
function saveToSlot(n){
 let info=slotInfo(n);
 if(!info.empty&&typeof confirm==="function"&&!confirm("槽位 "+n+" 已有存档，确定覆盖？"))return;
 let snap=Object.assign({},gs);
 delete snap.inFight;delete snap.enemy;delete snap.foes;delete snap.aiEnabled; // 运行时字段不落档（同 saveGame）
 snap.inFight=false;snap.enemy=null;snap.foes=null;
 let saveData={gs:snap,allAch:allAch,meta:_slotMeta()};
 try{localStorage.setItem(_slotKey(n),JSON.stringify(saveData));}
 catch(e){log("⚠保存失败（存储空间不足？）","red");return;}
 log("✅已保存到槽位 "+n+"（第"+(gs.ng||1)+"世·"+gs.year+"年·"+realmOf(gs.cult).name+"）");
 showSaveWindow(); // 刷新浮窗
}
function loadFromSlot(n){
 let s=localStorage.getItem(_slotKey(n));
 if(!s){log("⚠槽位 "+n+" 为空","red");return;}
 let d;
 try{d=JSON.parse(s);}catch(e){log("⚠槽位 "+n+" 数据损坏","red");return;}
 if(!d||!d.gs){log("⚠槽位 "+n+" 结构异常","red");return;}
 _saveWinClose();
 _applySaveData(d);
}
function deleteSlot(n){
 if(typeof confirm==="function"&&!confirm("确定删除槽位 "+n+" 的存档？"))return;
 localStorage.removeItem(_slotKey(n));
 log("已删除槽位 "+n+"。");
 showSaveWindow();
}
//最近档（槽位中 meta.time 最新；无槽位档时回落旧单槽）
function loadLatest(){
 let best=null;
 for(let n=1;n<=SAVE_SLOTS;n++){
  let info=slotInfo(n);
  if(!info.empty&&info.meta&&info.meta.time&&(!best||info.meta.time>best.time))best={time:info.meta.time,load:()=>loadFromSlot(n)};
 }
 if(!best){
  if(localStorage.getItem("mud_save")){document.getElementById("logbox").innerHTML="";loadGame();return;}
  log("⚠没有任何存档","red");return;
 }
 document.getElementById("logbox").innerHTML="";
 best.load();
}
//存档管理浮窗：每槽一行（摘要+时间+存/读/删）
var _saveBox=null;
function _saveWinClose(){if(_saveBox){try{_saveBox.remove();}catch(_){}_saveBox=null;}}
function showSaveWindow(){
 if(typeof document==="undefined"||!document.body)return;
 _saveWinClose();
 if(typeof _infoBox!=="undefined"&&_infoBox&&_infoBox.remove){try{_infoBox.remove();}catch(_){}} // 互斥浮窗
 let box=document.createElement("div"); box.id="savebox";
 box.style.cssText="position:fixed;left:50%;top:10%;transform:translateX(-50%);z-index:1000;max-width:92%;max-height:76%;overflow:auto;background:var(--panel,#efe8d8);border:1px solid var(--border,#c9bfa8);box-shadow:0 4px 18px var(--shadow,rgba(60,50,30,.18));padding:12px 18px;border-radius:8px;font-size:13px;color:var(--ink,#2f2a24);";
 let h=document.createElement("div");
 h.style.cssText="font-weight:bold;color:var(--gold,#8a6d3b);margin-bottom:8px;";
 h.textContent="💾 存档管理（"+SAVE_SLOTS+" 槽位）";
 let x=document.createElement("span"); x.textContent=" ✕";
 x.style.cssText="float:right;cursor:pointer;font-weight:bold;";
 x.onclick=_saveWinClose;
 h.appendChild(x); box.appendChild(h);

//==== 存档 v6 迁移：v1（无 version/attrs/flags）→ v2 补默认 → v3 补 P3 容器 → v5 补 P4 叙事引擎 → v6 补 P6 元游戏/多人，数值零漂移 ====
function migrateSave(){
 if(!gs.version)gs.version=2;
 if(!gs.attrs)gs.attrs={};
 for(let k in BALANCE.attrsInit){
  if(gs.attrs[k]===undefined)gs.attrs[k]=BALANCE.attrsInit[k];
 }
 if(!gs.flags)gs.flags={};
 if(!gs.customEquips)gs.customEquips=[]; // P4 词缀装备随档持久化（读档后 equipByName 可寻回）
 // v2→v3：补 P3 容器字段，缺失即补默认，已有值不动（零漂移）
 if(gs.version<3){
  if(!gs.inventory)gs.inventory={};
  if(!gs.ownedEquips)gs.ownedEquips=[];
  if(!gs.statuses)gs.statuses=[];
  if(!gs.reputation)gs.reputation={};
  if(!gs.arts)gs.arts={};
  if(gs.talent===undefined)gs.talent=null;
  if(gs.mp===undefined)gs.mp=mpMax();
  gs.version=3;
 }
 // v3→v5：补 P4 叙事引擎字段（v4 未单独发版，直接升 v5）
 if(gs.version<5){
  if(!gs.quests)gs.quests={};
  if(!gs.relations)gs.relations={};
  gs.version=5;
 }
 // v5→v6：补 P6 元游戏/多人字段
	if(gs.version<6){
	 if(gs.diff===undefined)gs.diff=1;
	 if(!gs.bio)gs.bio=[];
	 if(gs.ng===undefined)gs.ng=0;
	 gs.version=6;
	}
	// v6→v7：补 J34 后续 NPC 深度扩展字段
	if(gs.version<7){
	 if(!gs.npcLifespan)gs.npcLifespan={};
	 if(!gs.disciples)gs.disciples=[];
	 if(!gs.enemies)gs.enemies=[];
	 // J34 方向2：团体战斗运行时字段（防旧档缺字段）
	 if(!gs.foes)gs.foes=[];
	 if(gs.foeIndex===undefined)gs.foeIndex=0;
	 if(!gs.foeReward)gs.foeReward={cult:0,stone:0};
	 if(gs.foeLeader===undefined)gs.foeLeader=null;
	 gs.version=7;
	}
	// v7→v8：补 J34 方向3 记忆与阅历字段
	if(gs.version<8){
	 if(!gs.memories)gs.memories={};
	 gs.version=8;
	}
}

//==== 条件表达式系统（方向⑤）：数组=AND，单条不匹配即 false ====
// 类型：attr(修为/六属性) flag(因果标记) year(年份) item/rep(P3 接入)
function checkCond(c){
 if(Array.isArray(c))return c.every(checkCond);
 if(!c)return true;
 let v=condValue(c);
 if(v===null)return true; // 未接入类型/缺失字段：不拦截
 switch(c.op||"=="){
  case ">":return v>c.val;
  case ">=":return v>=c.val;
  case "<":return v<c.val;
  case "<=":return v<=c.val;
  case "==":return v==c.val;
  case "!=":return v!=c.val;
 }
 return false;
}
function condValue(c){
 switch(c.type){
  case "attr":
   if(gs[c.key]!==undefined)return gs[c.key];
   if(gs.attrs&&gs.attrs[c.key]!==undefined)return gs.attrs[c.key];
   return null;
  case "flag":return !!gs.flags[c.key]?true:false;
  case "year":return gs.year;
  case "item":return (gs.inventory&&gs.inventory[c.key])||0; // P3 背包接入
  case "rep":return (gs.reputation&&gs.reputation[c.key])||0; // P3 势力接入
  case "relation":return (gs.relations&&gs.relations[c.key])||0; // P4 NPC 好感接入
  case "disciple":return (gs.disciples&&gs.disciples.length)||0; // J34 后续：弟子数
  case "enemy":return (gs.enemies&&gs.enemies.length)||0;        // J34 后续：仇敌数
  case "memory": // J34 方向3：记忆门控（key=具体记忆→布尔；无 key=阅历数）
   if(c.key)return hasMemory(c.key)?true:false;
   return memoryCount();
 }
 return null;
}
function setFlag(k,v){gs.flags[k]=v;}

//==== 境界：派生值（由 cult 计算，不落存档）====
function realmOf(cult){
 let r=BALANCE.realms[0];
 for(let i=BALANCE.realms.length-1;i>=0;i--){
  if(cult>=BALANCE.realms[i].cult){r=BALANCE.realms[i];break;}
 }
 return r;
}

//时间流逝，长生被动涨修为（无状态时悟性=10 与原版公式完全一致，零漂移；P6 难度倍率；J34 后续弟子加成）
function passYear(n){
 gs.year+=n;
 let gain= n*(BALANCE.cultGainBase+(attrEff("comprehension")-10)*BALANCE.cultGainAttr+gs.equipBonus*BALANCE.cultGainEquip);
 gs.cult+=Math.floor(gain*(typeof diffMult==="function"?diffMult():1)*(1+discipleCultBonus()/100));
 tickStatuses(n); // P3a：BUFF/DEBUFF 随岁月 tick
 tickNpcLifespan(n); // J34 后续：NPC 寿命随岁月流逝
 tickDisciples(n);   // J34 后续：弟子成长/离世
 syncMemories();     // J34 方向3：岁月流逝，往事自然记起
 gs.mp=mpMax();   // P3b：岁月流逝，灵力自然回满
 refreshUi();
 if(gs.year>=100)addAch("a2");
}

//==== J34 后续：NPC 寿命流逝（首次对话初始化 expireYear；寿元尽则离世）====
function npcExpireYear(npcId){
 let npc=NPCS[npcId];
 if(!npc)return null;
 if(!gs.npcLifespan[npcId]){
  let lifespan=npc.lifespan!==undefined?npc.lifespan:200;
  gs.npcLifespan[npcId]={expireYear:gs.year+lifespan};
 }
 return gs.npcLifespan[npcId].expireYear;
}
function isNpcDead(npcId){
 return gs.npcLifespan[npcId]&&gs.year>=gs.npcLifespan[npcId].expireYear;
}
function npcRemaining(npcId){
 let e=npcExpireYear(npcId);
 if(e===null)return null;
 return Math.max(0,e-gs.year);
}
function tickNpcLifespan(n){
 for(let id in gs.npcLifespan){
  if(gs.year>=gs.npcLifespan[id].expireYear&&!gs.flags["npc_dead_"+id]){
   setFlag("npc_dead_"+id,true);
   let npc=NPCS[id];
   if(npc){
    log(`\n【${npc.name}】寿元已尽，与世长辞。`,"danger");
    bioLog("故人离世",`${npc.name}寿元已尽，与世长辞。`);
   }
  }
 }
}

<script>
//==== memory.js：记忆与阅历引擎（J34 方向3）====
// gs.memories = {id: 解锁年份}；条件驱动解锁，阅历等级由记忆数派生
// 记忆门控对话：checkCond({type:"memory",key:"mem_xxx",val:true}) / ({type:"memory",op:">=",val:N})

//扫描记忆配置表，条件达成即记起（幂等：已解锁不重复记）
function syncMemories(){
 let added=0;
 for(let id in MEMORIES){
  if(gs.memories[id]!==undefined)continue;
  let m=MEMORIES[id];
  if(m.need&&!checkCond(m.need))continue;
  gs.memories[id]=gs.year;
  log(`\n📖【阅历】你记起一段往事：【${m.name}】${m.desc}`,"blue");
  bioLog("阅历",`记起往事【${m.name}】。`);
  added++;
 }
 if(added)refreshUi();
 return added;
}

function hasMemory(id){return gs.memories&&gs.memories[id]!==undefined;}
function memoryCount(){return gs.memories?Object.keys(gs.memories).length:0;}

//阅历等级（由记忆数派生，不落档）
function memoryLevel(){
 let n=memoryCount();
 if(n>=10)return {name:"阅尽沧桑",desc:"千年岁月，故人皆已成灰。你见过太多，也放下了太多。"};
 if(n>=6)return {name:"见多识广",desc:"你走过山川湖海，见过恩怨情仇。"};
 if(n>=3)return {name:"阅历渐丰",desc:"你开始懂得，长生路上，风景比终点更重要。"};
 return {name:"初入红尘",desc:"你的故事，才刚刚开始。"};
}

//回忆场景：盘点已记起的往事
function sceneMemory(){
 syncMemories();
 log("\n📖【回忆】你闭上眼，往事如潮水般涌来。");
 let lv=memoryLevel();
 log(`（阅历：${memoryCount()} 段记忆｜${lv.name}——${lv.desc}）`);
 let unlocked=Object.keys(MEMORIES).filter(id=>hasMemory(id));
 if(!unlocked.length){log("（你尚未留下任何值得铭记的往事。）");}
 for(let id of unlocked){
  let m=MEMORIES[id];
  log(`·【${m.name}】${m.desc}（${gs.memories[id]}年）`);
 }
 addBtn("离开",()=>mainStep0());
}
</script>
<script>
//==== buff.js：持久 BUFF/DEBUFF 系统（P3a，passYear 驱动 tick）====
// 状态模型：{id, name, years(剩余年数), attrMods:{属性:修正}, hpPerYear, cultPerYear}
// 设计：attrMods 为"存续期间生效"的修正（attrEff 派生，不落档）；hpPerYear/cultPerYear 为每年增量。

//添加/刷新状态（同 id 覆盖刷新年限）
function addStatus(st){
 gs.statuses=gs.statuses.filter(s=>s.id!==st.id);
 gs.statuses.push(st);
 log(`✦获得状态【${st.name}】（持续${st.years}年）`,"blue");
 refreshUi();
}
function hasStatus(id){return gs.statuses.some(s=>s.id===id);}
function removeStatus(id){gs.statuses=gs.statuses.filter(s=>s.id!==id);}

//有效属性 = 基础属性 + 存续状态修正 + 被动功法加成（P3a/P3b 修炼/战斗统一走此派生）
function attrEff(k){
 let v=gs.attrs[k]||0;
 for(let s of gs.statuses){if(s.attrMods&&s.attrMods[k])v+=s.attrMods[k];}
 v+=artBonus(k); // P3b：被动功法常驻加成
 return v;
}

//时间流逝 tick：每年增量生效 + 年限扣减 + 到期移除（挂入 passYear）
function tickStatuses(n){
 if(!gs.statuses.length)return;
 let expired=[];
 for(let s of gs.statuses){
  if(s.hpPerYear){gs.hp=Math.min(gs.hpmax,gs.hp+s.hpPerYear*n);}
  if(s.cultPerYear){gs.cult+=s.cultPerYear*n;}
  s.years-=n;
  if(s.years<=0)expired.push(s);
 }
 for(let s of expired){
  removeStatus(s.id);
  log(`✦状态【${s.name}】已随岁月消散`,"blue");
 }
}
</script>
<script>
//==== inventory.js：背包系统（P3a：消耗品/材料 + 多装备持有换装）====

//物品增删查
function addItem(name,n=1){
 gs.inventory[name]=(gs.inventory[name]||0)+n;
 log(`获得物品【${name}】×${n}`,"green");
}
function removeItem(name,n=1){
 if((gs.inventory[name]||0)<n)return false;
 gs.inventory[name]-=n;
 if(gs.inventory[name]<=0)delete gs.inventory[name];
 return true;
}
function countItem(name){return gs.inventory[name]||0;}

//使用消耗品（效果由 data/items.js 配置驱动）
function useItem(name){
 let it=ITEMS[name];
 if(!it||it.type!=="consumable"){log("该物品无法使用");return false;}
 if(!removeItem(name,1)){log("背包中没有此物品");return false;}
 let u=it.use||{};
 if(u.hp){gs.hp=Math.min(gs.hpmax,gs.hp+u.hp);log(`恢复生命 ${u.hp} 点`,"green");}
 if(u.hpmax){gs.hpmax=Math.max(1,gs.hpmax+u.hpmax);gs.hp=Math.min(gs.hp,gs.hpmax);log(`生命上限${u.hpmax>0?"+":""}${u.hpmax}`,"green");}
 if(u.cult){gs.cult+=u.cult;log(`修为+${u.cult}`,"green");}
 if(u.stone){gs.stone+=u.stone;log(`灵石+${u.stone}`,"green");}
 if(u.attrs){for(let k in u.attrs){gs.attrs[k]=(gs.attrs[k]||0)+u.attrs[k];log(`${BALANCE.attrsName[k]||k}+${u.attrs[k]}`,"green");}}
 if(u.status){addStatus(u.status);}
 log(`你使用了【${name}】`,"green");
 refreshUi();
 return true;
}

//==== 多装备：持有列表 + 换装（gs.equip/equipBonus 仍为当前装备，兼容旧逻辑）====
function gainEquip(eq){
 if(!gs.ownedEquips.includes(eq.name))gs.ownedEquips.push(eq.name);
 setEquip(eq);
}
function equipByName(name){return allEquip.find(e=>e.name===name)||(gs.customEquips||[]).find(e=>e.name===name);}
function switchEquip(name){
 if(!gs.ownedEquips.includes(name)){log("你并未持有该装备");return false;}
 let eq=equipByName(name);
 if(!eq){log(`【${name}】装备数据缺失（旧档残留），已从持有列表移除`,"red");gs.ownedEquips=gs.ownedEquips.filter(n=>n!==name);return false;}
 setEquip(eq);
 log(`你换上了【${name}】`,"green");
 refreshUi();
 return true;
}

//==== 行囊界面（使用物品 / 换装）====
function sceneInventory(){
 log("\n🎒【行囊】你清点随身之物。");
 let keys=Object.keys(gs.inventory);
 if(keys.length===0)log("（背包空空如也）");
 for(let name of keys){
  let it=ITEMS[name];
  let cnt=gs.inventory[name];
  if(it&&it.type==="consumable"){
   addBtn(`使用【${name}】×${cnt}——${it.desc}`,()=>{useItem(name);sceneInventory();});
  }else{
   log(`· ${name}×${cnt}（${it?it.desc:"杂物"}）`);
  }
 }
 log(`\n当前装备：${gs.equip}（加成+${gs.equipBonus}）｜持有：${gs.ownedEquips.join("、")}`);
 forlet: { // 换装按钮
  for(let name of gs.ownedEquips){
   if(name===gs.equip)continue;
   let eq=equipByName(name);
   addBtn(`换装【${name}】（加成+${eq.bonus}）——${eq.desc}`,()=>{switchEquip(name);sceneInventory();});
  }
 }
 addBtn("合上背囊，返回",()=>routeByStep());
}

//==== 炼丹炼器（P3b：配方配置化 + 成功率，材料消耗）====
function alchemyChance(recipe){
 let ch=recipe.baseRate||BALANCE.alchemyBase;
 let t=TALENTS[gs.talent];
 if(t&&t.effect&&t.effect.alchemy)ch+=t.effect.alchemy;
 return Math.min(0.95,ch);
}
function canCraft(recipe){
 for(let m in recipe.mats){if((gs.inventory[m]||0)<recipe.mats[m])return false;}
 return true;
}
function craft(name){
 let r=RECIPES[name];
 if(!r){log("没有此配方");return false;}
 if(!canCraft(r)){log("材料不足！","red");return false;}
 for(let m in r.mats){removeItem(m,r.mats[m]);}
 if(Math.random()<alchemyChance(r)){
  let out=r.out;
  let eq=equipByName(out);
  if(eq){gainEquip(eq);log(`炼制成功！你获得【${out}】！`,"gold");}
  else{addItem(out,1);log(`炼制成功！你获得【${out}】！`,"gold");}
 }else{
  log("炼制失败，材料化为飞灰……","red");
 }
 refreshUi();
 return true;
}
function sceneAlchemy(){
 log("\n⚗【炼丹炼器】你架起丹炉，清点材料。");
 let mats=Object.keys(gs.inventory).filter(n=>(ITEMS[n]&&ITEMS[n].type==="material"));
 if(mats.length){log(`材料：${mats.map(m=>`${m}×${gs.inventory[m]}`).join("、")}`);}
 else{log("（没有材料）");}
 for(let name in RECIPES){
  let r=RECIPES[name];
  let need=Object.keys(r.mats).map(m=>`${m}×${r.mats[m]}`).join("+");
  let ok=canCraft(r)?"":"（材料不足）";
  addBtn(`炼制【${name}】——需 ${need}，成功率${Math.floor(alchemyChance(r)*100)}%${ok}`,()=>{craft(name);sceneAlchemy();});
 }
 addBtn("收起丹炉，离开",()=>mainStep0());
}
</script>
<script>

//习得功法（检查 cultReq，重复习得拒绝）
function learnArt(id){
 let a=ARTS[id];
 if(!a){log("没有此功法");return false;}
 if(gs.arts[id]){log(`你已习得【${id}】`);return false;}

 refreshUi();
 return true;
}

//被动功法属性加成（并入 attrEff，常驻生效）
function artBonus(k){
 let v=0;
 for(let id in gs.arts){
  let a=ARTS[id];
  if(!a)continue; // 旧档残留已删功法 id 防御（防 attrEff 崩线）
  if(a.type==="passive"&&a.attrMods&&a.attrMods[k])v+=a.attrMods[k];
 }
 return v;
}

//主动技能释放：战斗中命中敌方，战斗外仅演示
function castSkill(id){

 if(!a||a.type!=="active"){log("没有此技能");return false;}
 if(!gs.arts[id]){log(`你尚未习得【${id}】`,"red");return false;}

 }else{

 }
 return true;
}

//渡劫成功率：基础 + 渡劫节点功法加成（上限 95%）
function tribulationChance(){
 let base=BALANCE.tribBase;
 for(let id in gs.arts){
  let a=ARTS[id];
  if(!a)continue; // 旧档残留防御
  if(a.type==="tribulation"&&a.tribBonus)base+=a.tribBonus;
 }
 return Math.min(0.95,base);
}

//渡劫事件（P3b：渡劫期后触发，成败两分支）

 addBtn("引动天劫，放手一搏",()=>{

 });
 addBtn("暂避锋芒，改日再渡",()=>mainStep0());

<script>
//==== faction.js：势力声望系统（P3b：声望增减/阵营判定/门控）====

//声望增减：加一方，对立阵营按 50% 反向扣减（阵营对立互斥）；魔种觉醒命格对魔渊声望+20%
//未知势力（王朝派系/模组势力等不在 FACTIONS 的）照常累加，仅已知势力做对立扣减
function addRep(faction,n){
 let t=TALENTS[gs.talent];
 let mul=1;
 if(faction==="魔渊"&&t&&t.effect&&t.effect.demonRep)mul+=t.effect.demonRep;
 let gain=Math.floor(n*mul);
 gs.reputation[faction]=(gs.reputation[faction]||0)+gain;
 let opp=FACTIONS[faction]&&FACTIONS[faction].oppose;
 if(opp&&gain>0){gs.reputation[opp]=(gs.reputation[opp]||0)-Math.floor(gain*0.5);}
 log(`🏛你对【${faction}】的声望${gain>=0?"+":""}${gain}（当前 ${repLevel(faction)}）`,"blue");
 refreshUi();
}

//声望等级（阈值由数值派生）
function repLevel(faction){
 let v=gs.reputation[faction]||0;
 if(v>=500)return "崇拜";
 if(v>=200)return "尊敬";
 if(v>=50)return "友好";
 if(v>0)return "陌生";
 if(v>-50)return "冷淡";
 return "敌对";
}

//阵营对立判定
function isOpposed(f1,f2){
 if(!FACTIONS[f1]||!FACTIONS[f2])return false;
 return FACTIONS[f1].oppose===f2||FACTIONS[f2].oppose===f1;
}

//声望门控（满足门槛才解锁）
function factionGate(faction,req){
 return (gs.reputation[faction]||0)>=req;
}

//==== 势力面板场景 ====
function sceneFaction(){
 log("\n🏛【势力】你审视自己在各方势力间的声望。");
 for(let f in FACTIONS){
  let v=gs.reputation[f]||0;
  let opp=FACTIONS[f].oppose?`（对立：${FACTIONS[f].oppose}）`:"";
  log(`· ${f}：${v}（${repLevel(f)}）${opp}`);
 }
 addBtn("离开",()=>mainStep0());
}
</script>
<script>
//==== encounter.js：奇遇事件系统（P3b：条件触发，内容+引擎）====

    if(gs.stone>=200){gs.stone-=200;gainEquip(equipByName("流云道袍"));log("你购得流云道袍。他眯眼笑了笑：「道友爽快。」","green");}

 }},
 {cond:null,weight:2,run:function(){

   addBtn("迎战妖兽",()=>startFight(monsterList[0]));

 }},
 {cond:{type:"attr",key:"cult",op:">=",val:500},weight:1,run:function(){

];

//触发奇遇（概率 = 基础 + 命格加成；条件过滤后加权随机；auto=由主菜单随机门唤入时跳过内层概率门）
function triggerEncounter(auto){
 let base=BALANCE.encounterBase;
 let t=TALENTS[gs.talent];
 if(t&&t.effect&&t.effect.encounter)base+=t.effect.encounter;
 if(!auto && Math.random()>base){
  log("\n你四处游历，却一无所获。");
  addBtn("继续前行",()=>mainStep0());
  return;
 }
 let pool=ENCOUNTERS.filter(e=>!e.cond||checkCond(e.cond));
 if(!pool.length){log("\n你四处游历，却一无所获。");addBtn("继续前行",()=>mainStep0());return;}
 let total=pool.reduce((s,e)=>s+(e.weight||1),0);
 let r=Math.random()*total;
 for(let e of pool){
  r-=(e.weight||1);
  if(r<=0){genNarrateEncounter(e);e.run();return;} // J35 M4 触发点1：奇遇氛围文案（锚点喂料，L0 直出）
 }
 genNarrateEncounter(pool[0]);
 pool[0].run();
}

<script>
//==== quest.js：任务引擎（P4 叙事引擎）====
// gs.quests = {id: 当前步索引(number) | "done" | "failed"}
// 接取/推进/完成全走 checkCond 门控（D4 唯一门控）；循环任务完成后重置为 active

//任务是否可接（need 条件达成 + 未接取/未完成/未失败）
function questAvailable(id){
 let q=QUESTS[id];
 if(!q)return false;
 if(gs.quests[id]==="done"||gs.quests[id]==="failed")return false;
 if(typeof gs.quests[id]==="number")return false; // 已接取进行中
 if(q.need&&!checkCond(q.need))return false;
 return true;
}

//接取任务
function acceptQuest(id){
 let q=QUESTS[id];
 if(!q){log("没有此任务");return false;}
 if(!questAvailable(id)){log(`【${q.name}】当前无法接取`,"red");return false;}
 gs.quests[id]=0;
 log(`📜你接取了任务【${q.name}】`,"gold");
 refreshUi();
 return true;
}

//推进任务：当前步条件达成 → 结算奖励 → 步进；最后一步 → 完成
function advanceQuest(id){
 let q=QUESTS[id];
 if(!q||typeof gs.quests[id]!=="number"){log("任务未在进行中","red");return false;}
 let idx=gs.quests[id];
 let st=q.steps[idx];
 if(!checkCond(st.cond)){log(`【${q.name}】尚未达成：${st.desc}`,"red");return false;}
 if(st.reward)applyReward(st.reward);
 log(`✅【${q.name}】进度推进：${st.desc}`,"green");
 if(idx===q.steps.length-1){completeQuest(id);}
 else{gs.quests[id]=idx+1;}
 refreshUi();
 return true;
}

//完成任务：应用 onDone；循环任务重置为 active
function completeQuest(id){
 let q=QUESTS[id];
 if(q.kind==="loop"){
  gs.quests[id]=0;
  log(`🔄【${q.name}】完成！可再次接取。`,"gold");
 }else{
  gs.quests[id]="done";
  log(`🏆【${q.name}】完成！`,"gold");
 }
 if(q.onDone)applyReward(q.onDone);
 if(q.onDone&&q.onDone.unlockQuest)log(`🔓【${QUESTS[q.onDone.unlockQuest].name}】解锁了新线索！`,"blue");
 syncMemories(); // J34 方向3：任务完成记起往事
}

//统一奖励结算（任务步奖励 / onDone 共用）
function applyReward(r){
 if(!r)return;
 if(r.flags)for(let k in r.flags)setFlag(k,r.flags[k]);
 if(r.items)for(let k in r.items)addItem(k,r.items[k]);
 if(r.rep)for(let k in r.rep)addRep(k,r.rep[k]);
 if(r.cult)gs.cult+=r.cult;
 if(r.stone)gs.stone+=r.stone;
 if(r.attrs)for(let k in r.attrs)gs.attrs[k]+=r.attrs[k];
}

//==== 任务面板场景 ====
function questPanel(){
 log("\n📜【任务】你盘点心中所系之事。");
 let avail=Object.keys(QUESTS).filter(id=>questAvailable(id));
 if(avail.length){
  log("（可接取）");
  for(let id of avail){
   let q=QUESTS[id];
   addBtn(`接取【${q.name}】（${q.kind}）`,()=>{acceptQuest(id);questPanel();});
  }
 }
 let active=Object.keys(gs.quests).filter(id=>typeof gs.quests[id]==="number");
 if(active.length){
  log("（进行中）");
  for(let id of active){
   let q=QUESTS[id];
   if(!q)continue; // 旧档残留已删任务 id 防御
   let st=q.steps[gs.quests[id]];
   if(!st)continue;
   addBtn(`推进【${q.name}】：${st.desc}`,()=>{advanceQuest(id);questPanel();});
  }
 }
 addBtn("离开任务面板",()=>mainStep0());
}
</script>
<script>
//==== dialogue.js：NPC 对话树引擎（P4 叙事引擎）====
// gs.relations = {npcId: 好感值}；多轮树遍历，选项 checkCond 门控，effect 改关系/声望/flags

//关系等级（由好感值派生）
function relationLevel(npcId){
 let v=gs.relations[npcId]||0;
 if(v>=50)return "知己";
 if(v>=20)return "友好";
 if(v>0)return "相识";
 if(v>-20)return "陌生";
 return "交恶";
}
function addRelation(npcId,n){
 gs.relations[npcId]=(gs.relations[npcId]||0)+n;
}

//开启对话（从 start 节点进入；NPC 已故则进入追忆）
function startDialogue(npcId){
 if(!NPCS[npcId]){log("此人不在眼前");return;}
 npcExpireYear(npcId); // J34 后续：首次对话初始化寿命
 showPortrait(npcId,NPCS[npcId].name);
 if(isNpcDead(npcId)){memorialDialogue(npcId);return;}
 dialogueNode(npcId,"start");
}

//NPC 已故追忆（按关系等级渲染；仇敌的恩怨随风散）
function memorialDialogue(npcId){
 let npc=NPCS[npcId];
 let rel=relationLevel(npcId);
 log(`\n🪦【${npc.name}】的墓前，荒草萋萋。`);
 if(rel==="知己"){
  log("你想起他生前最后的话，忽然觉得，长生也没那么长。");
 }else if(rel==="友好"||rel==="相识"){
  log("你与他交情不深，但此刻站在墓前，仍有些怅然。");
 }else{
  log("你与他不过萍水相逢。如今人已作古，恩怨也一并埋进了土里。");
 }
 if(hasEnemy(npcId)){
  log("他曾是你的仇敌。如今仇怨随风散，你在他墓前站了一会儿。");
  removeEnemy(npcId);
 }
 addBtn("默立片刻，转身离去",()=>{hidePortrait();mainStep0();});
}

//渲染对话节点：文本 + 条件门控的选项
function dialogueNode(npcId,nodeId){
 let npc=NPCS[npcId];
 let node=npc.dialogue[nodeId];
 if(!node){hidePortrait();log("对话结束。");mainStep0();return;}
 log(`\n💬【${npc.name}】${node.text}`);
 let opts=node.options.filter(o=>!o.need||checkCond(o.need));
 if(!opts.length){hidePortrait();log("（无话可说，对话结束）");mainStep0();return;}
 for(let o of opts){
  addBtn(o.text,()=>{
   if(o.effect)applyDialogueEffect(npcId,o.effect);
   if(o.next&&o.next!=="end"){dialogueNode(npcId,o.next);}
   else{hidePortrait();log(`你与【${npc.name}】结束了对话。`);mainStep0();}
  });
 }
}

//对话效果结算（关系/声望/flags/物品/属性/时间/收徒/结仇）
function applyDialogueEffect(npcId,eff){
 if(!eff)return;
 if(eff.relation)for(let k in eff.relation)addRelation(k,eff.relation[k]);
 if(eff.rep)for(let k in eff.rep)addRep(k,eff.rep[k]);
 if(eff.flags)for(let k in eff.flags)setFlag(k,eff.flags[k]);
 if(eff.items)for(let k in eff.items)addItem(k,eff.items[k]);
 if(eff.cult)gs.cult+=eff.cult;
 if(eff.stone)gs.stone+=eff.stone;
 if(eff.year)passYear(eff.year);
 if(eff.hp)gs.hp=Math.min(gs.hpmax,gs.hp+eff.hp);
 if(eff.equip){let eq=equipByName(eff.equip);if(eq)gainEquip(eq);}
 if(eff.disciple)addDisciple(eff.disciple.name,eff.disciple.talent); // J34 后续：收徒
 if(eff.enemy)addEnemy(eff.enemy.npcId,eff.enemy.reason);           // J34 后续：结仇
 refreshUi();
}

//==== 故人场景（拜访 NPC；need 门控：按路线/解锁条件显示；已故标注）====
function sceneNpc(){
 log("\n💬【故人】你回想一路走来结识之人。");
 for(let id in NPCS){
  let npc=NPCS[id];
  if(npc.need&&!checkCond(npc.need))continue; // 未达条件不显示（如宗门/江湖/轮回镜解锁）
  let dead=isNpcDead(id);
  addBtn(`拜访【${npc.name}】${dead?"（已故）":""}（${npc.faction}，好感${relationLevel(id)}）`,()=>startDialogue(id));
 }
 addBtn("离开",()=>mainStep0());
}
</script>
<script>
//==== loot.js：词缀掉落（P4 战斗深度）====
// 击杀带 affixDrop 的怪物后，按词缀池 + 基础装备池生成词缀装备（名=词缀·本体，加成叠加）

//词缀配置（bonus 叠加到本体装备）
const AFFIXES={
 "烈焰":{bonus:8,desc:"火焰之力附体，灼烧万物"},
 "妖气":{bonus:6,desc:"妖气缠绕，凶性毕露"},
 "噬魂":{bonus:10,desc:"噬魂之力，侵蚀心神"},
 "魔骨":{bonus:7,desc:"魔骨淬炼，坚不可摧"}
};
//词缀装备的基础本体池（副本掉落可生成的本体）
const AFFIX_BASES=["青锋短剑","玄木护符","流云道袍"];

//掉落：返回生成的词缀装备（无 affixDrop 返回 null）
function rollLoot(monster){
 if(!monster||!monster.affixDrop||!monster.affixDrop.length)return null;
 let affixName=monster.affixDrop[Math.floor(Math.random()*monster.affixDrop.length)];
 let affix=AFFIXES[affixName];
 let baseName=AFFIX_BASES[Math.floor(Math.random()*AFFIX_BASES.length)];
 let base=equipByName(baseName);
 if(!base)return null;
 let name=affixName+"·"+baseName;
 if(!equipByName(name)){
  // 词缀装备写入 gs.customEquips 随档持久化（修复：仅 push allEquip 运行时数组，读档后丢失致行囊报错）
  (gs.customEquips=gs.customEquips||[]).push({name:name,bonus:base.bonus+affix.bonus,desc:affix.desc+"，"+base.desc});
 }
 gainEquip(equipByName(name));
 log(`✨掉落词缀装备【${name}】（加成+${base.bonus+affix.bonus}）！`,"gold");
 return equipByName(name);
}
</script>
<script>
//==== fight.js：回合战斗系统（P4 战斗深度 + J34 方向2 团体战斗）====
// 团体战斗数据模型（运行时，不落档）：gs.foes 敌人数组 / gs.enemy 当前目标 / gs.foeIndex 目标索引
// gs.foeReward 团体总奖励（启动时聚合）/ gs.foeLeader 首领（词缀掉落基准）

//开始战斗：兼容单怪与团体（传数组即团体战）
function startFight(monsterObj){
 let list=Array.isArray(monsterObj)?monsterObj:[monsterObj];
 startFightGroup(list);
}

//团体战斗：克隆敌人数组，聚合总奖励，记录首领
function startFightGroup(monsters){
 gs.inFight=true;
 // P1-3 死接线修复：难度敌人倍率（diffEnemyMult）在此接进开战克隆——只缩放血量/攻击，奖励不缩放
 let dm=(typeof diffEnemyMult==="function")?diffEnemyMult():1;
 gs.foes=monsters.map(m=>{let c=JSON.parse(JSON.stringify(m));c.hp=Math.floor(c.hp*dm);c.atk=Math.floor(c.atk*dm);c.hpMax=c.hp;return c;});
 gs.foeIndex=0;
 gs.enemy=gs.foes[0];
 gs.foeLeader=gs.foes[0];
 gs.foeReward={cult:0,stone:0};
 for(let m of gs.foes){
  gs.foeReward.cult+=(m.reward&&m.reward.cult)||0;
  gs.foeReward.stone+=(m.reward&&m.reward.stone)||0;
 }
 document.getElementById("fightui").style.display="block";
 log(`\n⚔战斗开启！遭遇${gs.foes.length>1?gs.foes.length+"名敌人":"【"+gs.enemy.name+"】"}！`,"danger");
 renderFightUi();
 fightTurn();
}
function renderFightUi(){
 document.getElementById("enemyName").innerText=gs.enemy.name+(gs.foes.length>1?`（${gs.foeIndex+1}/${gs.foes.length}）`:"");
 document.getElementById("enemyHpText").innerText=gs.enemy.hp;
 let pct=Math.max(0,gs.enemy.hp)/gs.enemy.hpMax*100;
 document.getElementById("enemyHpBar").style.width=pct+"%";
}
function fightTurn(){
 if(!gs.inFight)return;
 clearOpt();
 addBtn("🗡挥剑攻击",()=>{playerAttack();});
 // P3b：主动技能（已习得的 active 功法）
 let actives=Object.keys(gs.arts).filter(id=>ARTS[id]&&ARTS[id].type==="active");
 for(let id of actives){
  let a=ARTS[id];
  addBtn(`⚡施展【${id}】（耗${a.mpCost}灵力，伤${a.dmg}）`,()=>{castSkill(id);});
 }
 addBtn("🛡防御格挡",()=>{playerDefend();});
 addBtn("🎒使用道具",()=>{fightItem();}); // P4：战斗内用消耗品
 addBtn("🏃尝试逃跑（不一定成功）",()=>{tryEscape();});
}
//P4：战斗内道具子菜单（用消耗品后返回战斗）
function fightItem(){
 clearOpt();
 log("\n🎒【战斗道具】你翻找随身之物。");
 let consumables=Object.keys(gs.inventory).filter(n=>ITEMS[n]&&ITEMS[n].type==="consumable");
 if(!consumables.length){log("（没有可用道具）");}
 for(let n of consumables){
  addBtn(`使用【${n}】×${gs.inventory[n]}`,()=>{
   useItem(n);
   if(gs.hp>0)fightTurn();
  });
 }
 addBtn("返回战斗",()=>fightTurn());
}
function playerAttack(){
 let t=TALENTS[gs.talent];
 let mul=(t&&t.effect&&t.effect.atkMul)||1;
 let dmg=Math.floor((BALANCE.atkBase + gs.equipBonus*BALANCE.atkEquip + gs.cult*BALANCE.atkCult + attrEff("constitution")*BALANCE.atkConstitution)*mul);
 log(`你发起攻击，对【${gs.enemy.name}】造成 ${dmg} 点伤害！`,"green");
 if(damageEnemy(dmg))return;
 enemyTurn();
}
function playerDefend(){
 log("你摆出防御姿态，降低受到的伤害");
 let edmg=Math.floor(gs.enemy.atk*0.4);
 gs.hp-=edmg;
 log(`敌方攻击，防御抵消部分伤害，受到${edmg}伤害`,"red");
 checkPlayerDead();
 if(!gs.enemy)return; // 重伤路径 endFight 已置空 enemy，勿再渲染战斗 UI（修复 TypeError）
 renderFightUi();
 if(gs.hp>0)fightTurn();
}
function tryEscape(){
 let r=Math.random();
 if(r>0.45){
  log("✅你成功脱身逃离战场！");
  endFight();
  backAfterFight();
 }else{
  log("❌逃跑失败！敌人紧追不放！","danger");
  enemyTurn();
 }
}

//对当前目标造成伤害；目标死亡切换下一目标；全部击杀→fightWin
function damageEnemy(dmg){
 let e=gs.enemy;
 e.hp-=dmg;
 renderFightUi();
 if(e.hp>0)return false;
 log(`你击杀了【${e.name}】！`,"gold");
 gs.foes.splice(gs.foeIndex,1);
 if(!gs.foes.length){fightWin();return true;}
 gs.foeIndex=Math.min(gs.foeIndex,gs.foes.length-1);
 gs.enemy=gs.foes[gs.foeIndex];
 log(`【${gs.enemy.name}】冲上前来！`,"danger");
 renderFightUi();
 return true;
}

//敌方回合：所有存活敌人各攻击一次（含各自 AI）
function enemyTurn(){
 for(let m of gs.foes){
  let dmg=m.atk+Math.floor(Math.random()*8);
  // P4：敌人 AI（狂暴/阶段/治疗/召唤，均按血量比例触发一次）
  if(m.ai==="enrage"&&m.hp<m.hpMax*(m.aiParam.hpPct||0.5)){
   if(!m._enraged){m._enraged=true;log(`${m.name}陷入狂暴，攻击暴涨！`,"danger");}
   dmg=Math.floor(dmg*(m.aiParam.atkMul||1.5));
  }
  if(m.ai==="phase"&&m.hp<m.hpMax*(m.aiParam.hpPct||0.5)){
   if(!m._phased){
    m._phased=true;
    m.atk=Math.floor(m.atk*(m.aiParam.atkMul||1.3));
    log(`${m.name}进入第二阶段，气势陡然攀升！`,"danger");
   }
  }
  if(m.ai==="heal"&&m.hp<m.hpMax*(m.aiParam.hpPct||0.4)){
   if(!m._healed){
    m._healed=true;
    let heal=Math.floor(m.hpMax*(m.aiParam.healPct||0.25));
    m.hp=Math.min(m.hpMax,m.hp+heal);
    log(`${m.name}汲取天地灵气，恢复${heal}点生命！`,"blue");
   }
  }
  if(m.ai==="summon"&&m.hp<m.hpMax*(m.aiParam.hpPct||0.5)){
   if(!m._summoned){
    m._summoned=true;
    let minion=monsterByName(m.aiParam.minion);
    log(`${m.name}召唤出${m.aiParam.minion}助战！`,"danger");
    if(minion){gs.hp-=minion.atk;log(`${m.aiParam.minion}对你发动攻击，造成${minion.atk}伤害！`,"red");}
   }
  }
  gs.hp-=dmg;
  log(`${m.name}发动攻击，对你造成 ${dmg} 伤害！`,"red");
  if(gs.hp<=0){checkPlayerDead();return;}
 }
 checkPlayerDead();
 renderFightUi();
 if(gs.hp>0)fightTurn();
}
function fightWin(){
 log(`🎉你击退了所有敌人！`,"gold");
 addAch("a9");
 let rw=gs.foeReward;
 gs.cult+=rw.cult;
 gs.stone+=rw.stone;
 log(`获得修为+${rw.cult}，灵石+${rw.stone}`);
 // P4：任务钩子（斩妖支线 + 秘境主线副本通关标记）
 setFlag("kill_monster",true);
 if(gs.step===6)setFlag("dungeon_yaoshan",true);
 else if(gs.step===7)setFlag("dungeon_magiccave",true);
 else if(gs.step===8)setFlag("dungeon_starrelic",true);
 syncMemories(); // J34 方向3：初战/副本通关记起往事
 rollLoot(gs.foeLeader); // P4：词缀掉落（带 affixDrop 的 BOSS，rollLoot 内部判空）
 endFight();
 backAfterFight();
}
function endFight(){
 gs.inFight=false;
 gs.enemy=null;
 gs.foes=[];
 gs.foeIndex=0;
 gs.foeReward={cult:0,stone:0};
 gs.foeLeader=null;
 document.getElementById("fightui").style.display="none";
 refreshUi();
}
function checkPlayerDead(){
 //长生特性：hp归零不会真正死亡，重伤，多年后恢复
 if(gs.hp<=0){
  log("\n💔你身受致命重创！长生特性触发，肉身不灭，但神魂受损。","danger");
  gs.hp=20;
  gs.status="神魂重伤";
  passYear(40);
  log("耗费四十年光阴缓缓恢复伤势");
  refreshUi();
  endFight();
  backAfterFight();
 }
}
function backAfterFight(){
 //战斗结束回到对应剧情分支
 if(gs.step===6){stepCopyYaoShan();}
 else if(gs.step===7){stepCopyMagicCave();}
 else mainStep0();
}
</script>

<script>
//==== events.js：NPC 随机事件系统 ====

function triggerRandomEvent(){
 // J35 M3 Director：事件密度门（pace 因子；director 未加载时兜底全发，行为零回归）
 let _rate=(typeof directorEventRate==="function")?DIRECTOR_EVENT_BASE*directorEventRate():1;
 if(_rate<1&&Math.random()>_rate){
  log("\n世间无事发生，岁月静静流淌。");
  addBtn("继续前行",()=>mainStep0());
  return;
 }
 let evts=[
  function evtNpcOldMan(){
   log("\n📜【NPC事件：落魄老修士】路边一个枯瘦的老修士拦住你，咳嗽像破风箱漏气：「咳……小友，你身上，有长生的气息。」");
   addBtn("倾听教诲，赠予灵石50换取感悟",()=>{
    if(gs.stone>=50){
     gs.stone-=50;
     gs.cult+=80;
     log("老修士说得很慢，一句是一句。你听完，丹田里那团气，好像活了一点。");
    }else log("你灵石不足，只能拱手告别");
    addBtn("继续前行",()=>mainStep0());
   });
   addBtn("婉言拒绝，径直离开",()=>{addBtn("继续前行",()=>mainStep0());});
  },

<script>
//==== world.js：大世界引擎（P5 开放世界）====
// gs.pos 当前区域；移动消耗岁月；据点升级（gs.world.strongholds 持久）；时间动态世界事件

//当前区域（默认红尘江湖）
function curRegion(){return WORLD.regions[gs.pos]||WORLD.regions.jianghu;}

//通用效果结算（世界事件/王朝/动态事件共用：rep/items/stone/cult/attrs）
function applyEffect(e){
 if(!e)return;
 if(e.rep)for(let k in e.rep)addRep(k,e.rep[k]);
 if(e.items)for(let k in e.items)addItem(k,e.items[k]);
 if(e.stone)gs.stone+=e.stone;
 if(e.cult)gs.cult+=e.cult;
 if(e.attrs)for(let k in e.attrs)gs.attrs[k]+=e.attrs[k];
}

//移动（相邻区域 + 消耗岁月）
function moveTo(regionId){
 let r=WORLD.regions[regionId];
 if(!r){log("没有此地");return;}
 let cur=curRegion();
 if(!cur.adjacent.includes(regionId)){log(`【${r.name}】与当前【${cur.name}】不相邻，无法直接前往`,"red");return;}
 gs.pos=regionId;
 log(`你启程前往【${r.name}】，跋山涉水。`);
 passYear(5);
 if(enemyRevenge())return; // J34 后续：仇敌寻仇（触发战斗则不再渲染抵达）
 if(ambushCheck(r))return; // J34 方向2：区域伏击（触发战斗则不再渲染抵达）
 log(`你抵达【${r.name}】：${r.desc}`,"blue");
 sceneRegion();
}

//J34 方向2：区域伏击（危险区域按 ambushRate 概率触发；30% 概率遭遇团体）
function ambushCheck(r){
 if(!r.ambushRate||Math.random()>=r.ambushRate)return false;
 let pool=r.monsters||["山林妖狼"];
 let n=Math.random()<0.3?2:1;
 let foes=[];
 for(let i=0;i<n;i++){
  let m=monsterByName(pool[Math.floor(Math.random()*pool.length)]);
  if(m)foes.push(m);
 }
 if(!foes.length)return false;
 log(`\n⚠你被${foes.length>1?foes.length+"名妖兽":"【"+foes[0].name+"】"}伏击！`,"danger");
 startFight(foes);
 return true;
}

//区域场景（据点/交易/动态事件/王朝/移动）
function sceneRegion(){
 let r=curRegion();
 log(`\n📍【${r.name}】${r.desc}`);
 if(r.stronghold){
  let sh=WORLD.strongholds[r.stronghold];
  addBtn(`🏯进入据点【${sh.name}】（Lv${strongholdLevel(r.stronghold)}）`,()=>sceneStronghold(r.stronghold));
 }
 addBtn("🏪在此交易",()=>sceneTrade());
 addBtn("🌍触发动态事件",()=>sceneDynamicEvent());
 addBtn("🏛关注凡俗王朝",()=>sceneDynasty());
 log("（可前往）");
 for(let adj of r.adjacent){
  let ar=WORLD.regions[adj];
  addBtn(`🚶前往【${ar.name}】`,()=>moveTo(adj));
 }
 addBtn("返回主界面",()=>mainStep0());
}

//据点等级（gs.world.strongholds 持久，默认 1）
function strongholdLevel(id){
 return (gs.world&&gs.world.strongholds&&gs.world.strongholds[id])||1;
}
function setStrongholdLevel(id,lv){
 if(!gs.world)gs.world={strongholds:{}};
 if(!gs.world.strongholds)gs.world.strongholds={};
 gs.world.strongholds[id]=lv;
}

//据点被动加成（每10年额外修为）
function strongholdBonus(id){
 let sh=WORLD.strongholds[id];
 if(!sh)return 0;
 let lv=strongholdLevel(id);

 }else log("（已达最高等级）");
 addBtn("离开据点",()=>sceneRegion());

//待触发的时间动态世界事件（year 到达且未抉择）
function pendingWorldEvent(){

  if(gs.year>=ev.year&&!gs.flags["dyn_"+ev.id])return ev;
 }
 return null;

//世界事件场景（mainStep0 优先展示；flag 记录已抉择）

   log("你做出了抉择，世界随之改变。","blue");
   mainStep0();

 }
}

 }

<script>
/* gen.js - J35 M4 三级生成管线（L0 模板 / L1 Ollama / L2 云端默认关 + 五闸成本控制）
 * 独立模块，不接引擎；接线（index.html + build.py）列 v0.5。
 * 原则：呈现可变，走向锁定（锁定区校验通过才上屏）。 */
const GEN_SETTINGS = {
  enabled: true, level: "L0",
  l1: { baseUrl: "http://127.0.0.1:11434", model: "qwen3", maxTokens: 300, temperature: 0.8 },
  l2: { enabled: false, endpoint: "", apiKey: "", dailyBudget: 0, cooldownMin: 30, maxTokens: 500 },
  cache: {}, budget: { spent: 0, day: "" }
};
const L0_TEMPLATES = {
  breakthrough: ["灵气如潮水般涌入经脉，{realm}的门槛在脚下碎裂。", "岁月无声，修为又进一步——{realm}。"],
  encounter: ["山雨欲来，{kw}的气息自远方逼近。", "命运的丝线轻轻颤动，{kw}之劫将至。"],
  npc_greet: ["{npc}抬眼看来：「长生路上，难得故人。」"],
  transition: ["数载寒暑，弹指即过。", "时光如白驹过隙。"]
};
function _stateFingerprint(gs) { return [gs.realm || 0, gs.year || 0, JSON.stringify(gs.flags || {})].join("|"); }
function genL0(kind, vars) {
  const pool = L0_TEMPLATES[kind] || L0_TEMPLATES.transition;
  let t = pool[(vars && vars.seed || 0) % pool.length];
  for (const k in (vars || {})) t = t.split("{" + k + "}").join(vars[k]);
  return { text: t, level: "L0", cost: 0 };
}
async function genL1(kind, vars, extraPrompt) {
  const s = GEN_SETTINGS.l1, body = {
    model: s.model, stream: false, think: false, // qwen3 思考型必须关 think，否则 num_predict 被思考吃尽（2026-08-23 实测）
    options: { num_predict: s.maxTokens, temperature: s.temperature },
    messages: [{ role: "user", content: (extraPrompt || "") + "\n用一句修仙小说口吻描写：" + kind + "（要素：" + JSON.stringify(vars || {}) + "）" }]
  };
  const r = await fetch(s.baseUrl + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("L1 http " + r.status);
  const d = await r.json();
  let t = (d.message && d.message.content) || d.response || "";
  t = String(t).replace(/<think>[\s\S]*?<\/think>/g, "").replace(/^[\s\S]{0,400}?<\/think>/, "").trim(); // 思考输出兜底剥离
  return { text: t, level: "L1", cost: 0 };
}
async function genL2(kind, vars, extraPrompt) {
  const s = GEN_SETTINGS.l2;
  if (!s.enabled) return null;
  // 闸1 预算：日预算+冷却
  const today = new Date().toISOString().slice(0, 10);
  if (GEN_SETTINGS.budget.day !== today) { GEN_SETTINGS.budget = { spent: 0, day: today }; }
  if (GEN_SETTINGS.budget.spent >= s.dailyBudget) return null;
  const r = await fetch(s.endpoint, { method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + s.apiKey },
    body: JSON.stringify({ model: "default", max_tokens: s.maxTokens, messages: [{ role: "user", content: (extraPrompt || "") + " 要素：" + JSON.stringify(vars || {}) }] }) });
  if (!r.ok) throw new Error("L2 http " + r.status);
  const d = await r.json();
  GEN_SETTINGS.budget.spent += 1;
  return { text: ((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "").trim(), level: "L2", cost: 1 };
}
async function generate(kind, vars, extraPrompt) {
  // 闸2 缓存：同状态指纹命中直返
  const fp = kind + "|" + _stateFingerprint(typeof gs !== "undefined" ? gs : {});
  if (GEN_SETTINGS.cache[fp]) return Object.assign({}, GEN_SETTINGS.cache[fp], { cached: true });
  let out = null, tried = 0;
  while (!out && tried < 2) { // 闸5 校验：最多重试 1 次
    try {
      if (GEN_SETTINGS.level === "L2") out = await genL2(kind, vars, extraPrompt);
      if (!out && GEN_SETTINGS.level !== "L0") { try { out = await genL1(kind, vars, extraPrompt); } catch (e) { out = null; } }
      if (!out) out = genL0(kind, vars); // 降级保底
    } catch (e) { out = null; }
    tried++;
  }
  if (!out) out = genL0(kind, vars);
  if (!out.text) out = genL0(kind, vars); // 空输出回退 L0
  GEN_SETTINGS.cache[fp] = { text: out.text, level: out.level };
  return out;
}
//==== J35 M4 触发点1（2026-08-23）：奇遇氛围文案——锚点上下文喂料，L0 同步直出 / L1 异步升级 ====
// 剧情参照取自 novelAnchorContext()（玩家当前主线 → 原著锚点摘要），L0 零成本不喂上下文，L1/L2 走 extraPrompt
function genNarrateEncounter(e) {
  try {
    const kw = (e && e.title) || "机缘";
    if (GEN_SETTINGS.level === "L0") { // L0：同步直出，保证与奇遇正文顺序
      const out = genL0("encounter", { kw: kw, realm: (typeof gs !== "undefined" && gs) ? (gs.realm || 0) : 0 });
      log("✦ " + out.text, "blue");
    } else { // L1/L2：异步生成，回补一句（带等级标注）
      const ctx = (typeof novelAnchorContext === "function") ? novelAnchorContext(3) : "";
      generate("encounter", { kw: kw, realm: (typeof gs !== "undefined" && gs) ? (gs.realm || 0) : 0 }, ctx)
        .then(out => { if (out && out.text) log("✦ " + out.text + "（" + out.level + (out.cached ? "·缓存" : "") + "）", "blue"); })
        .catch(() => {});
    }
  } catch (_) { /* 管线异常静默，不影响奇遇本体 */ }
}
//==== J35 M4-3：设置持久化 + 游戏内 AI 设置面板（2026-08-23 实接）====
// 运行态设置以 localStorage 为准（story-settings.json 是管线侧默认值文档，file:// 下不可 fetch）
function genSettingsLoad() {
  try {
    const j = JSON.parse(localStorage.getItem("gen_settings_v1") || "{}");
    if (j.enabled !== undefined) GEN_SETTINGS.enabled = !!j.enabled;
    if (j.level) GEN_SETTINGS.level = j.level;
    if (j.l1) Object.assign(GEN_SETTINGS.l1, j.l1);
  } catch (_) {}
}
function genSettingsSave() {
  try {
    localStorage.setItem("gen_settings_v1", JSON.stringify({
      enabled: GEN_SETTINGS.enabled, level: GEN_SETTINGS.level,
      l1: { baseUrl: GEN_SETTINGS.l1.baseUrl, model: GEN_SETTINGS.l1.model }
    }));
  } catch (_) {}
}
//AI 生成设置面板（PANELS 注册 gen；L1 需 Ollama 在跑且经 http 启动器打开，file:// 下受 CORS 限自动降级 L0）
function sceneGenSettings() {
  const lv = GEN_SETTINGS.level;
  log("\n⚙【AI 生成设置】当前等级：" + (lv === "L1" ? "L1 本地模型（Ollama·" + GEN_SETTINGS.l1.model + "·零出网）" : "L0 模板（零成本）"), "gold");
  if (lv !== "L1") {
    addBtn("启用 L1 本地模型（需 Ollama 在跑，双击 start-http.bat 启动游戏）", () => {
      GEN_SETTINGS.level = "L1"; genSettingsSave();
      log("\n已启用 L1。生成不可达时自动降级 L0 模板兜底。","green"); sceneGenSettings();
    });
  } else {
    addBtn("切回 L0 模板", () => { GEN_SETTINGS.level = "L0"; genSettingsSave(); log("\n已切回 L0 模板。","green"); sceneGenSettings(); });
    addBtn("🔌测试本地模型连接", () => {
      log("\n正在探测 " + GEN_SETTINGS.l1.baseUrl + " …", "blue");
      fetch(GEN_SETTINGS.l1.baseUrl + "/api/tags").then(r => r.json()).then(d => {
        const ms = (d.models || []).map(m => m.name).join("、") || "（无模型）";
        log("✅ 连接成功，可用模型：" + ms, "green");
        addBtn("返回", () => sceneGenSettings());
      }).catch(() => {
        log("❌ 连接失败：Ollama 未运行，或游戏以 file:// 双击打开（CORS 限制）。请先启动 Ollama 并用 start-http.bat 打开游戏；期间生成走 L0 兜底。", "red");
        addBtn("返回", () => sceneGenSettings());
      });
    });
  }
  addBtn("ℹ说明", () => showInfo("AI 生成说明（L0/L1/L2 三级）", [
    "L0 模板：零成本本地模板文案，默认档，永远兜底。",
    "L1 本地模型：Ollama（" + GEN_SETTINGS.l1.model + "，:11434）零出网；需 Ollama 在跑且以 start-http.bat（http://127.0.0.1:8000）打开游戏——file:// 双击会被 CORS 拒。",
    "L2 云端：默认关（五闸成本控制：预算/冷却/缓存/开关/校验）。",
    "M3/M4 合流：L1 生成自动携带当前主线的原著锚点剧情参照（novelAnchorContext）。"
  ]));
  addBtn("返回", () => mainStep0());
}
genSettingsLoad(); // 启动即恢复用户设置
</script>
<script>
//==== eventgen.js：动态事件生成器（P5 模板+玩家状态，可选 AI 增强）====
// 模板池：{cond, weight, slots(变量池), title/desc(模板), choices(选项)}
// 生成：按玩家状态过滤 + 加权随机 → 填充变量 → 可选 gen.js AI 润色（默认关，主线锁定）

const EVENT_TEMPLATES=[
 {cond:null,weight:3,slots:{kw:["妖兽","魔修","灵兽"]},title:"{kw}拦路",desc:"你在路上遭遇{kw}拦路，来者不善",choices:[
  {text:"迎战",fight:"山林妖狼"},
  {text:"绕道而行",effect:{stone:20}}
 ]},
 {cond:{type:"attr",key:"cult",op:">=",val:200},weight:2,slots:{kw:["上古遗迹","秘境入口"]},title:"发现{kw}",desc:"你发现一处{kw}，灵气氤氲",choices:[
  {text:"探索",effect:{cult:80,stone:100}},
  {text:"谨慎离开",effect:{}}
 ]},
 {cond:{type:"flag",key:"modao",val:true},weight:2,slots:{kw:["魔道秘宝","血煞之气"]},title:"魔道机缘",desc:"魔气深处传来{kw}的波动",choices:[
  {text:"夺取机缘",effect:{attrs:{demon:5},stone:150}},
  {text:"克制贪念",effect:{attrs:{heart:5}}}
 ]},
 {cond:{type:"rep",key:"青云宗",op:">=",val:30},weight:1,slots:{kw:["宗门任务","巡山除妖"]},title:"宗门征召",desc:"青云宗征召弟子执行{kw}",choices:[
  {text:"应召前往",effect:{rep:{青云宗:20},stone:80}},
  {text:"婉言推辞",effect:{}}
 ]}
];

//生成动态事件（模板 + 玩家状态过滤 + 加权随机 + 变量填充）
function genDynamicEvent(){
 let pool=EVENT_TEMPLATES.filter(e=>!e.cond||checkCond(e.cond));
 if(!pool.length)return null;
 let total=pool.reduce((s,e)=>s+(e.weight||1),0);
 let r=Math.random()*total;
 let tpl=pool[0];
 for(let e of pool){r-=(e.weight||1);if(r<=0){tpl=e;break;}}
 let vars={};
 for(let k in tpl.slots){
  let arr=tpl.slots[k];
  vars[k]=arr[Math.floor(Math.random()*arr.length)];
 }
 let title=tpl.title,desc=tpl.desc;
 for(let k in vars){
  title=title.split("{"+k+"}").join(vars[k]);
  desc=desc.split("{"+k+"}").join(vars[k]);
 }
 return {tpl:tpl,vars:vars,title:title,desc:desc};
}

//AI 增强（可选）：用 gen.js generate 润色事件描述（默认关；仅润色呈现，不改变选项/走向）
async function aiEnhanceEvent(ev){
 if(!(typeof generate==="function")||!GEN_SETTINGS||!GEN_SETTINGS.enabled)return ev.desc;
 try{
  let g=await generate("encounter",ev.vars,"润色这段动态事件描述，保持修仙口吻：");
  if(g&&g.text)return g.text;
 }catch(e){}
 return ev.desc;
}

//动态事件场景（gs.aiEnabled 时走 AI 润色；主线/结局锁定不受影响）
async function sceneDynamicEvent(){
 let ev=genDynamicEvent();
 if(!ev){log("\n你四处游历，天地平静，并无异动。");addBtn("继续前行",()=>mainStep0());return;}
 let text=ev.desc;
 if(gs.aiEnabled){text=await aiEnhanceEvent(ev);}
 log(`\n🌍【动态事件：${ev.title}】${text}`,"blue");
 for(let c of ev.tpl.choices){
  addBtn(c.text,()=>{
   if(c.fight){startFight(monsterByName(c.fight));return;}
   applyEffect(c.effect);
   log("你做出了抉择。","blue");
   mainStep0();
  });
 }
}
</script>
<script>
/* director.js - J35 M3 剧情导演模块首版（引擎/叙事分离：参数可变、走向结局锁定）
 * 设计对齐 director-config-pack：可调面（节奏/变体）vs 锁定面（已发生事实/主线/结局）。
 * 首版落地：pace 节奏（事件密度因子）+ 结局锁定校验 + 面板；intensity/顺序/变体批次列后续
 * （intensity 与既有 diff 难度系统的叠加关系需内容侧裁决，不空接）。 */
const DIRECTOR = {
  pace: "normal",       // slow|normal|fast
  intensity: "normal",  // low|normal|high（首版未接引擎，仅存参）
  variantSeed: 0        // 叙事变体种子（同一周目稳定，跨周目可换）
};
const DIRECTOR_PACE = { slow: 0.6, normal: 1, fast: 1.5 };      // 事件密度因子
const DIRECTOR_YEAR = { slow: 1.5, normal: 1, fast: 0.7 };      // 岁月步长建议因子（叙事层选用）
const DIRECTOR_EVENT_BASE = 0.8;                                // 随机事件基础密度（triggerRandomEvent 入口门）
// 结局锁定清单（story.js 锁定区，AI/模组只可填充不可改走向）
const LOCKED_ENDINGS = ["endingHide", "endingDemon", "endingInvincible", "endingDead"];

function directorEventRate() { return DIRECTOR_PACE[DIRECTOR.pace] || 1; }
function directorYearFactor() { return DIRECTOR_YEAR[DIRECTOR.pace] || 1; }
// 锁定校验：结局函数必须在锁定清单且真实存在（mod 校验/回归门可用）
function directorAssertLock(fnName) {
  return LOCKED_ENDINGS.indexOf(fnName) >= 0 && typeof window[fnName] === "function";
}
function directorSettingsLoad() {
  try {
    const j = JSON.parse(localStorage.getItem("director_settings_v1") || "{}");
    if (j.pace) DIRECTOR.pace = j.pace;
    if (j.intensity) DIRECTOR.intensity = j.intensity;
    if (typeof j.variantSeed === "number") DIRECTOR.variantSeed = j.variantSeed;
  } catch (_) {}
}
function directorSettingsSave() {
  try { localStorage.setItem("director_settings_v1", JSON.stringify({ pace: DIRECTOR.pace, intensity: DIRECTOR.intensity, variantSeed: DIRECTOR.variantSeed })); } catch (_) {}
}
// 导演面板：节奏三档 + 结局锁定清单展示（PANELS 注册 director）
function sceneDirector() {
  log("\n🎬【剧情导演】节奏：" + DIRECTOR.pace + "（事件密度×" + directorEventRate() + "·岁月因子×" + directorYearFactor() + "）｜强度：" + DIRECTOR.intensity + "（未接引擎，列后续批次）", "gold");
  for (const p of ["slow", "normal", "fast"]) {
    let cur = DIRECTOR.pace === p ? "✓ " : "";
    addBtn(cur + "节奏：" + ({ slow: "慢热·岁月悠长（事件稀疏）", normal: "标准", fast: "快节奏·世事频仍" })[p], () => {
      DIRECTOR.pace = p; directorSettingsSave();
      log("节奏已调为 " + p + "（事件密度×" + directorEventRate() + "）。", "green"); sceneDirector();
    });
  }
  addBtn("🎲换一个变体种子（-1）", () => {
    DIRECTOR.variantSeed = (DIRECTOR.variantSeed - 1) | 0; directorSettingsSave();
    log("变体种子：" + DIRECTOR.variantSeed + "（跨周目叙事变体启用时生效）。", "green"); sceneDirector();

<script>
//==== modloader.js：模组系统（P5 模组规范/加载/冲突检测/编辑器）====
// 模组规范：{id, name, version, content:{quests:{}, npcs:{}, items:{}, monsters:{}}}
// 命名空间隔离：builtin:/mod: 前缀；冲突检测：同 id 且内容不同则拒绝
// 编辑器草稿（浏览器内可视化编辑，prompt 交互）

let modDraft=null;

//模组注入目标（与内置内容同对象，加载即生效）
const MOD_TARGETS={quests:QUESTS,npcs:NPCS,items:ITEMS,monsters:MONSTERS};
//内置内容快照（冲突检测基准）
const MOD_BUILTIN={};
for(let k in MOD_TARGETS)MOD_BUILTIN[k]=Object.assign({},MOD_TARGETS[k]);

//校验模组 JSON 是否符合规范
function modValidate(mod){
 if(!mod||typeof mod!=="object")return {ok:false,err:"模组必须为对象"};
 if(!mod.id||typeof mod.id!=="string")return {ok:false,err:"缺少 id"};
 if(!mod.name)return {ok:false,err:"缺少 name"};
 if(!mod.version)return {ok:false,err:"缺少 version"};
 if(!mod.content||typeof mod.content!=="object")return {ok:false,err:"缺少 content"};
 return {ok:true};
}

//冲突检测：与内置同 id 且内容不同 → 冲突
function modConflictCheck(mod){
 let conflicts=[];
 for(let section in MOD_TARGETS){
  let mods=mod.content[section]||{};
  for(let id in mods){
   let builtin=MOD_BUILTIN[section][id];
   if(builtin!==undefined&&JSON.stringify(builtin)!==JSON.stringify(mods[id])){
    conflicts.push({section:section,id:id,type:"builtin"});
   }
  }
 }
 return conflicts;
}

//加载模组（校验 + 冲突检测 + 注入 + 登记 gs.mods）
function modLoad(mod){
 let v=modValidate(mod);
 if(!v.ok){log("模组校验失败："+v.err,"red");return false;}
 let conflicts=modConflictCheck(mod);
 if(conflicts.length){
  log(`模组【${mod.name}】存在 ${conflicts.length} 处冲突，拒绝加载：`,"red");
  for(let c of conflicts)log(`  ${c.section}.${c.id}（与内置冲突）`,"red");
  return false;
 }
 for(let section in MOD_TARGETS){
  let mods=mod.content[section]||{};
  for(let id in mods)MOD_TARGETS[section][id]=mods[id];
 }
 if(!gs.mods)gs.mods={};
 gs.mods[mod.id]={name:mod.name,version:mod.version};
 log(`✅模组【${mod.name}】v${mod.version} 加载成功。`,"green");
 refreshUi();
 return true;
}

//导出模组 JSON（编辑器产物）
function modExport(id,name,version,content){
 return JSON.stringify({id:id,name:name,version:version,content:content||{}},null,2);
}

//模组面板
function sceneModPanel(){
 log("\n📦【模组】当前已加载："+(gs.mods&&Object.keys(gs.mods).length?Object.keys(gs.mods).join("、"):"无"));
 addBtn("📤导出模组模板",()=>{
  log("模组 JSON 模板（复制到文件/控制台）：\n"+modExport("my_mod","我的模组","0.1",{quests:{},npcs:{},items:{},monsters:{}}),"blue");
  sceneModPanel();
 });
 addBtn("📥加载模组（粘贴 JSON）",()=>sceneModImport());
 addBtn("🛠模组编辑器",()=>sceneModEditor());
 addBtn("离开模组面板",()=>mainStep0());
}

//模组导入（浏览器 prompt 输入 JSON）
function sceneModImport(){
 log("\n📥【加载模组】请在浏览器弹窗中粘贴模组 JSON。");
 let json=prompt("粘贴模组 JSON：");
 if(json){
  try{
   let mod=JSON.parse(json);
   modLoad(mod);
  }catch(e){log("JSON 解析失败："+e.message,"red");}
 }
 sceneModPanel();
}

//模组编辑器（可视化：新增任务 → 草稿 → 导出）
function sceneModEditor(){
 log("\n🛠【模组编辑器】可视化编辑模组内容。");
 addBtn("新增任务（输入 id/名称）",()=>{
  let id=prompt("任务 id（如 q_mod_test）：");
  let name=prompt("任务名称：");
  if(id&&name){
   if(!modDraft)modDraft={};
   if(!modDraft.quests)modDraft.quests={};
   modDraft.quests[id]={name:name,kind:"side",need:null,steps:[{desc:"模组任务第一步",cond:null,reward:{stone:50}}],onDone:{}};
   log(`已加入草稿：任务【${name}】`,"green");
  }
  sceneModEditor();
 });
 addBtn("导出模组 JSON",()=>{
  log("模组 JSON：\n"+modExport("my_mod","我的模组","0.1",modDraft||{}),"blue");
  sceneModEditor();
 });
 addBtn("返回模组面板",()=>sceneModPanel());
}
</script>

//==== 传记：gs.bio 记录关键节点 [{year,name,desc}]，跨世累积 ====
function bioLog(name,desc){
 if(!gs.bio)gs.bio=[];
 gs.bio.push({year:gs.year,name:name,desc:desc});
}
function biography(){
 let lines=[];
 lines.push(`《长生赋》人物传记 · 第${gs.ng||1}世`);
 lines.push(`——${gs.year}年，${realmOf(gs.cult).name}，修为${gs.cult}点`);

 }
 if(gs.achs&&gs.achs.length)lines.push("── 成就 ──\n"+gs.achs.join("、"));
 if(gs.reputation&&Object.keys(gs.reputation).length){
  lines.push("── 声望 ──");

 if(gs.endType)lines.push(`结局：${["","万古隐仙","宗门老祖","万古魔主","岁月道主","长生归寂"][gs.endType]}`);
 return lines.join("\n");

function sceneBiography(){
 log("\n📜【人物传记】","gold");
 log(biography());
 addBtn("📤导出传记（复制到剪贴板）",()=>{

 });
 addBtn("🕊存入拾光记忆库",()=>bioToShiguang()); // J35 M4-4：传记对接拾光 personal 域

}
//==== J35 M4-4：传记写入拾光（:8766 /api/diary → docs/personal/，零出网）====
// 双通道：①直投（拾光若放行本页 Origin 则直接入库）②403/网络失败→下载 .md 由拾光「导入」功能落库（拾光拒跨源 Origin 是其 CSRF 防护设计，不绕过）
function bioToShiguang(){
 const title="长生赋·人物传记·第"+(gs.ng||1)+"世·"+gs.year+"年";
 const body=biography();
 const today=new Date().toISOString().slice(0,10);
 fetch("http://127.0.0.1:8766/api/diary",{
  method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({title:title,body:body+"\n\n（MUD游戏《长生梦录》传记导出）",date:today,private:false})
 }).then(r=>r.json()).then(d=>{
  if(d.ok){log("✅ 已存入拾光个人记忆域（doc_id:"+d.doc_id+"）。","green");addBtn("返回",()=>sceneBiography());}
  else{log("拾光返回错误："+(d.error||"未知")+"，走文件导出通道。","red");bioDownloadFallback(title,body,today);}
 }).catch(()=>{
  log("直连拾光不可达（服务未开或跨源拦截——拾光仅放行自家页面，属安全设计）。已转文件导出：","red");
  bioDownloadFallback(title,body,today);
 });
}
function bioDownloadFallback(title,body,date){
 try{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["# "+title+"\n\n"+body+"\n"],{type:"text/markdown"}));
  a.download="longlife-bio-"+date+".md";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  log("📦 已下载 longlife-bio-"+date+".md → 打开拾光(:8766)用「导入」功能选择该文件即入个人记忆域。","blue");
 }catch(_){ log("自动下载失败，请用「导出传记（复制到剪贴板）」手动粘贴。","red"); }
 addBtn("返回",()=>sceneBiography());
}

<script>
//==== novel.js：可替换多主题多文本剧情库（novel-lib-v2）====
// 数据：js/data/novel.js（THEMES 多主题数组，每主题含多篇 novels）
// 当前主题：_THEME；当前篇：_NOVEL（指向选中主题内的某篇）。
// 切换主题 -> 应用主题皮肤(css 变量) + 默认取该主题第一篇；切换篇目 -> 同步更新游戏名。

var _THEME = THEMES && THEMES.length ? THEMES[0] : null;
var _NOVEL = _firstNovel();

//==== 面板注册表：面板 id -> {label,icon,fn,desc}（数据驱动侧栏按钮，见 docs/面板可替换规范.md）====
var PANELS={
 inventory:{label:"行囊",    icon:"🎒", fn:"sceneInventory", desc:"物品与装备"},
 arts:    {label:"功法阁",  icon:"📖", fn:"sceneArts",      desc:"功法学习"},
 alchemy: {label:"炼丹炼器",icon:"⚗", fn:"sceneAlchemy",   desc:"炼丹炼器"},
 faction: {label:"势力声望",icon:"🏛", fn:"sceneFaction",   desc:"势力声望"},
 quest:   {label:"任务面板",icon:"📜", fn:"questPanel",     desc:"任务面板"},
 npc:     {label:"拜访故人",icon:"💬", fn:"sceneNpc",       desc:"角色互动"},
 memory:  {label:"回忆往事",icon:"📖", fn:"sceneMemory",    desc:"回忆往事"},
 novel:   {label:"原著剧情",icon:"📚", fn:"sceneNovel",     desc:"原著剧情"},
 bio:     {label:"人物传记",icon:"📜", fn:"sceneBiography", desc:"人物传记"},
 hint:    {label:"提示",    icon:"💡", fn:"sceneHint",      desc:"提示"},
 diff:    {label:"难度设置",icon:"⚙", fn:"sceneDifficulty",desc:"难度设置"},
 gen:     {label:"AI生成",  icon:"✨", fn:"sceneGenSettings", desc:"AI 生成等级（L0/L1 本地）"},
 director:{label:"剧情导演",icon:"🎬", fn:"sceneDirector",   desc:"节奏调节（结局锁定）"},
 share:   {label:"存档分享",icon:"🤝", fn:"sceneShare",     desc:"存档分享"},
 mod:     {label:"模组面板",icon:"📦", fn:"sceneModPanel",  desc:"模组面板"},
 // ---- 转生/异界专属面板 ----
 skilltree:{label:"技能树",icon:"🌳", fn:"sceneSkillTree", desc:"技能加点"},
 party:   {label:"伙伴",   icon:"🤝", fn:"sceneParty",     desc:"同伴伙伴"},
 bestiary:{label:"图鉴",   icon:"📖", fn:"sceneBestiary",  desc:"敌方/灵物图鉴"}
};

// 应用主题皮肤：把主题 css 变量注入 :root
function applyTheme(){
 if(!_THEME||!_THEME.css)return;
 let c=_THEME.css, r=document.documentElement.style;
 let map={
  bg:"--bg", bgFace:"--bg-face", ink:"--ink", inkSoft:"--ink-soft",
  border:"--border", borderSoft:"--border-soft", panel:"--panel", panelLight:"--panel-light",
  gold:"--gold", seal:"--seal", green:"--green", blue:"--blue",
  btnBorder:"--btn-border", hpEmpty:"--hp-empty", subText:"--sub-text",
  glow1:"--glow1", glow2:"--glow2", shadow:"--shadow",
  mtn1:"--mtn1", mtn2:"--mtn2", mtn3:"--mtn3"
 };
 for(let k in map){ if(c[k]!==undefined) r.setProperty(map[k], c[k]); }
 applyUi();
}
//应用主题面板配置：资源栏显隐+标签映射 + 侧栏按钮数据驱动渲染(PANELS注册表)
function applyUi(){
 if(typeof document==="undefined")return;
 let u=_THEME&&_THEME.ui? _THEME.ui:{};
 let res=u.resources||["life","realm","cult","hp","mp","stone","year","status"];
 let at=u.attrs||["constitution","soul","spirit","comprehension","heart","demon"];
 let resL=u.resLabels||{}, atL=u.attrLabels||{};
 let panels=u.panels||[];
 // ① 资源/属性栏：显隐 + 标签映射（主题可重命名标签，如力量/智力/敏捷）
 document.querySelectorAll(".ufield").forEach(function(el){
  let k=el.getAttribute("data-k");
  let isAttr=el.classList.contains("attr");
  let allow=isAttr?(at.indexOf(k)>=0):(res.indexOf(k)>=0);
  el.style.display=(k&&allow)?"":"none";
  if(k&&allow){
   let t=isAttr?atL[k]:resL[k];
   if(t){let lab=el.querySelector(".ulabel"); if(lab)lab.textContent=t;}
  }
 });
 // ② 侧栏按钮：按 ui.panels 顺序 + PANELS 注册表数据驱动渲染
 let c=document.getElementById("sidebtns");
 if(c){
  c.innerHTML="";
  for(let i=0;i<panels.length;i++){
   let p=PANELS[panels[i]]; if(!p)continue;
   let b=document.createElement("button");
   b.className="sidebtn";
   b.setAttribute("data-k",panels[i]);
   b.textContent=(p.icon||"")+(p.label||panels[i]);
   b.onclick=(function(fn){return function(){sideGo(fn);};})(p.fn);
   c.appendChild(b);
  }
 }
}
//侧栏功能按钮入口：按函数名调用（函数自带返回/离开按钮）
function sideGo(fn){
 if(typeof window[fn]==="function")window[fn]();
}
//切换主题（同步应用皮肤 + 默认取该主题第一篇，更新游戏名）
function setTheme(id){
 if(!THEMES||!THEMES.length)return;
 _THEME = THEMES.find(t=>t.id===id) || THEMES[0];
 applyTheme();
 _NOVEL = (_THEME.novels&&_THEME.novels.length)?_THEME.novels[0]:null;
 _novelAnchorCache=null; // 切篇失效，惰性重建
 applyGameTitle();
}
//切换当前篇目（同步更新游戏名标识）
function setNovel(id){
 if(!_THEME||!_THEME.novels||!_THEME.novels.length)return;
 _NOVEL = _THEME.novels.find(n=>n.id===id) || _THEME.novels[0] || null;
 _novelAnchorCache=null; // 切篇失效，惰性重建
 applyGameTitle();
}
//根据当前篇.game 更新游戏名（标题 + 页面头部 + seal）
function applyGameTitle(){
 let name=(_NOVEL&&_NOVEL.game)?_NOVEL.game:"长生梦录";
 let t=document.getElementById("gameTitle"); if(t)t.innerText=name;
 let ts=document.getElementById("gameTitleSpan"); if(ts)ts.innerText=name;
 let tl=document.getElementById("gameTitleShow"); if(tl)tl.innerText=name;
}
//启动时应用当前位置主题皮肤 + 游戏名
if(typeof THEMES!=="undefined"&&THEMES&&THEMES.length){_THEME=THEMES[0];applyTheme();_NOVEL=_firstNovel();applyGameTitle();}

//按章号取章节信息
function novelChapter(ch){
 if(!_NOVEL||!_NOVEL.chapters)return null;
 return _NOVEL.chapters.find(c=>c[0]===ch)||null;
}
//关键词检索（bigram 定位）：命中标题或关键词串，返回匹配章节数组
function novelSearch(kw){
 if(!_NOVEL||!_NOVEL.chapters)return [];
 let k=String(kw||"").trim();
 if(!k)return [];
 return _NOVEL.chapters.filter(c=>c[1].includes(k)||(c[2]||"").includes(k));
}

//随机一章（漫游当前篇）
function novelRandom(){
 if(!_NOVEL||!_NOVEL.chapters||!_NOVEL.chapters.length)return null;
 return _NOVEL.chapters[Math.floor(Math.random()*_NOVEL.chapters.length)];
}

//剧情锚点钩子：返回该章锚点，否则 null（J35 M3 批次1 优化：Map 缓存，切篇失效）
var _novelAnchorCache=null; // {map:章号->锚点, lines:{line->[锚点]}}
function _buildNovelAnchorCache(){
 if(!_NOVEL||!_NOVEL.anchors){_novelAnchorCache=null;return;}
 let m={},ln={};
 for(let a of _NOVEL.anchors){
  if(m[a.chapter]===undefined)m[a.chapter]=a; // 同章多锚点取首
  if(a.line){(ln[a.line]=ln[a.line]||[]).push(a);}
 }
 _novelAnchorCache={map:m,lines:ln};
}
function novelAnchor(ch){
 if(!_novelAnchorCache)_buildNovelAnchorCache();
 if(!_novelAnchorCache)return null;
 return _novelAnchorCache.map[ch]||null;
}

//剧情库主面板：可切主题 + 切篇目 + 检索 + 随机
function sceneNovel(){
 log("\n📚【剧情库】主题："+(_THEME?(("《"+_THEME.name+"》")+( _THEME.desc?("·"+_THEME.desc):"") ):"无"),"gold");
 if(_NOVEL){
  log("当前篇：《"+_NOVEL.title+"》·"+_NOVEL.author+" · 类型："+_NOVEL.type);
  if(_NOVEL.desc)log(_NOVEL.desc+"\n");
  let nAnch=(_NOVEL.anchors||[]).length;
  log("共 "+_NOVEL.chapters.length+" 章"+(nAnch?("·"+nAnch+" 剧情锚点（📌=检索命中）"):"")+"。可按关键词定位对应章节（人物/地名/功法名等）。");
 }else{
  log("（当前主题暂无已导入文本。可切换主题，或在 js/data/novel.js 的该主题 novels 里加一篇。）","blue");
 }
 addBtn("🎨切换主题",()=>sceneThemePick());
 if(_NOVEL)addBtn("🔄切换篇目",()=>sceneNovelPick());
 if(_NOVEL)addBtn("🔍检索关键词",()=>sceneNovelSearch());
 if(_NOVEL)addBtn("🎲随机一章",()=>{let c=novelRandom();if(c)sceneNovelChapter(c[0]);});
 if(novelAnchorsByLine("world").length)addBtn("🌍世界大事锚点",()=>sceneNovelLine("world"));
 addBtn("返回",()=>mainStep0());
}

//主题选择
function sceneThemePick(){
 log("\n🎨【选择主题】每主题可含多篇文章，切换后皮肤与游戏名随之更新：","blue");
 for(let t of (THEMES||[])){
  let cur=(_THEME&&t.id===_THEME.id)?"（当前）":"";
  let cnt=(t.novels&&t.novels.length)?t.novels.length+"篇":"0篇";
  addBtn((cur?"✓ ":"")+"《"+t.name+"》·"+cnt+cur,()=>{setTheme(t.id);log("\n已切换主题为《"+(_THEME? _THEME.name:"")+"》。","gold");sceneNovel();});
 }
 addBtn("返回",()=>sceneNovel());
}

//篇目选择（当前主题内）
function sceneNovelPick(){
 if(!_THEME||!_THEME.novels||!_THEME.novels.length){log("当前主题暂无文本。","red");sceneNovel();return;}
 log("\n📄【选择篇目】《"+_THEME.name+"》下共 "+_THEME.novels.length+" 篇：");
 for(let n of _THEME.novels){
  let cur=(_NOVEL&&n.id===_NOVEL.id)?"（当前）":"";
  addBtn((cur?"✓ ":"")+"《"+n.title+"》·"+n.type+cur,()=>{setNovel(n.id);log("\n已切换为《"+(_NOVEL? _NOVEL.title:"")+"》。","gold");sceneNovel();});
 }
 addBtn("返回",()=>sceneNovel());
}

//检索界面
function sceneNovelSearch(){
 log("\n🔍【检索】当前《"+_NOVEL.title+"》，输入关键词（人物名/地名/功法名）：","blue");
 addBtn("输入关键词",()=>{
  let kw=typeof prompt==="function"?prompt("输入检索关键词："):"";
  if(!kw){sceneNovelSearch();return;}
  let hits=novelSearch(kw);
  if(!hits.length){log("未找到与【"+kw+"】相关的章节。","red");addBtn("重新检索",()=>sceneNovelSearch());addBtn("返回",()=>sceneNovel());return;}
  log("检索【"+kw+"】命中 "+hits.length+" 章：","gold");
  for(let c of hits.slice(0,20))addBtn((novelAnchor(c[0])?"📌":"")+"第"+c[0]+"章 "+c[1],()=>sceneNovelChapter(c[0]));
  if(hits.length>20)log("……共 "+hits.length+" 章，仅显示前 20。");
  addBtn("重新检索",()=>sceneNovelSearch());
  addBtn("返回",()=>sceneNovel());
 });
 addBtn("返回",()=>sceneNovel());
}

//章节详情（含剧情锚点与前后章导航）
function sceneNovelChapter(ch){
 let c=novelChapter(ch);
 if(!c){log("没有此章。","red");sceneNovel();return;}
 log("\n📖 第"+c[0]+"章 "+c[1],"gold");
 if(c[2])log("关键词："+c[2]);
 let a=novelAnchor(c[0]);
 if(a){
  if(a.title)log("·"+a.title);
  if(a.trigger)log("触发："+a.trigger);
  if(a.summary)log("剧情："+a.summary);
  let refs=Array.isArray(a.refs)?a.refs:(a.refs||"").split(",").filter(Boolean); // 兼容数组/逗号串两代格式
  if(refs.length)log("关联："+refs.join("、"));
  if(a.line)log("线属："+(NOVEL_LINE_NAMES[a.line]||a.line),"blue");
 }else{
  log("（本篇暂无该章剧情锚点）","blue");
 }
 addBtn("◀上一章",()=>sceneNovelChapter(Math.max(1,c[0]-1)));
 addBtn("下一章▶",()=>sceneNovelChapter(Math.min(_NOVEL.chapters.length,c[0]+1)));
 addBtn("返回检索",()=>sceneNovelSearch());
 addBtn("返回剧情库",()=>sceneNovel());
}

//==== J35 M3 五线锚点：按线浏览原著对照（hide/jianghu/zongmen/modao/fuben/world）====
var NOVEL_LINE_NAMES={hide:"隐居·苟道种田",jianghu:"江湖·市井游历",zongmen:"宗门·五蕴宗",modao:"魔道·杀戮正邪",fuben:"副本·秘境历练",world:"世界大事"};
function novelAnchorsByLine(line){
 if(!_novelAnchorCache)_buildNovelAnchorCache();
 if(!_novelAnchorCache)return [];
 return _novelAnchorCache.lines[line]||[];
}
//锚点上下文（J35 M4 合流点）：按玩家当前主线（gs.step→线）取锚点摘要串，供 gen L1 extraPrompt 喂料
var STEP_LINE={1:"hide",2:"jianghu",3:"zongmen",4:"modao",6:"fuben",7:"fuben",8:"fuben"};
function novelAnchorContext(n){
 n=n||3;
 if(typeof gs==="undefined"||!gs)return "";
 let line=STEP_LINE[gs.step]||null;
 if(!line)return "";
 let as=novelAnchorsByLine(line);
 if(!as.length)return "";
 return "原著剧情参照（"+(NOVEL_LINE_NAMES[line]||line)+"）："+as.slice(0,n).map(a=>"第"+a.chapter+"章"+a.title+"："+a.summary).join("；");
}
//按线锚点面板（story.js 五线场景入口调用；无锚点时给出提示并返回剧情库）
function sceneNovelLine(line){
 let name=NOVEL_LINE_NAMES[line]||line;
 let as=novelAnchorsByLine(line);
 log("\n📖【原著锚点·"+name+"】《"+(_NOVEL?_NOVEL.title:"")+"》命中 "+as.length+" 个：","gold");
 if(!as.length)log("（本篇暂无该线锚点，可在剧情库切换篇目。）","blue");
 for(let a of as){
  addBtn("第"+a.chapter+"章 "+a.title,function(){sceneNovelChapter(a.chapter);});
 }
 addBtn("返回剧情库",function(){sceneNovel();});
}

//==== 转生/异界专属面板：技能树 / 伙伴 / 图鉴 ====
var gs_skill=gs_skill||{points:0,tree:{}}; // 技能点（转生成长资源）
function sceneSkillTree(){
 let sk=(typeof gs==="object"&&gs)?gs:{}; // 兜底
 log("\n🌳【技能树】转生世界以技能点驱动成长，当前技能点："+(sk_pts()),"gold");
 let tree=[
  {id:"str",name:"力量强化",max:10,desc:"物理伤害 +2/级"},
  {id:"agi",name:"敏捷身法",max:10,desc:"闪避率 +2%/级"},
  {id:"int",name:"精神增幅",max:5, desc:"魔力上限 +10/级"}
 ];
 for(let t of tree){
  let cur=(gs_skill.tree[t.id]||0);
  let full=cur>=t.max;
  log((full?"✔ ":"· ")+t.name+"（"+cur+"/"+t.max+"）"+t.desc);
  if(!full)addBtn("升级【"+t.name+"】（-1技能点）",(function(t){return function(){
   if(gs_skill.points<1){log("技能点不足！","red");sceneSkillTree();return;}
   gs_skill.points--; gs_skill.tree[t.id]=(gs_skill.tree[t.id]||0)+1;
   log("已升级【"+t.name+"】！","green");refreshUi();sceneSkillTree();
  };})(t));
 }
 addBtn("🎁获得技能点（演示）",function(){gs_skill.points++;log("技能点 +1，当前 "+gs_skill.points,"gold");sceneSkillTree();});
 addBtn("返回",function(){mainStep0();});
}
function sk_pts(){return gs_skill.points;}
function sceneParty(){
 if(!gs.party)gs.party=[];
 log("\n🤝【伙伴】与你同行的异界队友：","gold");
 if(!gs.party.length){log("（暂无伙伴，剧情中可结识。）","blue");}
 else{for(let p of gs.party)log("· "+p.name+"【"+p.title+"】好感"+p.favor+" 战力"+p.power);}
 addBtn("返回",function(){mainStep0();});
}
function sceneBestiary(){
 if(!gs.bestiary)gs.bestiary={};
 log("\n📖【图鉴】收录遭遇过的灵物与敌人：","gold");
 let keys=Object.keys(gs.bestiary);
 if(!keys.length){log("（图鉴空白，战斗/遭遇会逐步收录。）","blue");}
 else{for(let k of keys)log("· "+k+"：遭遇/击杀 "+gs.bestiary[k]+" 次");}
 addBtn("返回",function(){mainStep0();});
}
</script>
<script>
//==== share.js：多人雏形（P6 存档分享/道具交换，无实时战斗）====
// 分享码格式：CFSAVE1.<encodeURIComponent(JSON)> / CFGIFT1.<...>，纯 JS 无环境依赖

//==== 存档导出：gs+allAch 序列化为分享码 ====
function exportSave(){
 let data={gs:gs,allAch:allAch,ver:6};
 let code="CFSAVE1."+encodeURIComponent(JSON.stringify(data));
 if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(code).then(()=>log("存档码已复制！可发给他人导入。","green")).catch(()=>{});
 }else if(typeof prompt==="function"){
  prompt("复制以下存档码（发给他人）：",code);
 }
 log("📤存档已导出为分享码。","blue");
 return code;
}
function importSave(code){
 try{
  if(!code||code.indexOf("CFSAVE1.")!==0)throw new Error("格式错误");
  let d=JSON.parse(decodeURIComponent(code.slice(8)));
  if(!d.gs)throw new Error("缺 gs");
  gs=d.gs;
  migrateSave();
  if(d.allAch)Object.assign(allAch,d.allAch);
  renderAch();
  refreshUi();
  log("📥存档导入成功！","green");
  clearOpt();
  routeByStep();
  return true;
 }catch(e){
  log("存档导入失败："+e.message,"red");
  return false;
 }
}

//==== 道具交换码：背包道具打包为码（纯离线交换）====
function exportGift(){
 let items=gs.inventory||{};
 let keys=Object.keys(items);
 if(!keys.length){log("背包空空，无可交换道具。","red");return null;}
 let code="CFGIFT1."+encodeURIComponent(JSON.stringify({items:items}));
 if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(code).then(()=>log("交换码已复制！","green")).catch(()=>{});
 }else if(typeof prompt==="function"){
  prompt("复制以下交换码：",code);
 }
 log("🎁道具已打包为交换码。","blue");
 return code;
}
function importGift(code){
 try{
  if(!code||code.indexOf("CFGIFT1.")!==0)throw new Error("格式错误");
  let d=JSON.parse(decodeURIComponent(code.slice(8)));
  if(!d.items)throw new Error("缺 items");
  for(let k in d.items)addItem(k,d.items[k]);
  log("🎁道具交换成功！获得："+Object.keys(d.items).map(k=>`${k}×${d.items[k]}`).join("、"),"green");
  return true;
 }catch(e){
  log("交换码导入失败："+e.message,"red");
  return false;
 }
}

//==== 分享面板入口 ====
function sceneShare(){
 log("\n🤝【存档分享 / 道具交换】","blue");
 log("分享码为纯文本，可复制粘贴给他人离线导入；无实时战斗。");
 addBtn("📤导出存档码",()=>exportSave());
 addBtn("📥导入存档码",()=>{
  let code=typeof prompt==="function"?prompt("粘贴他人分享的存档码："):"";
  if(code)importSave(code);
 });
 addBtn("🎁导出道具交换码",()=>exportGift());
 addBtn("🎁导入道具交换码",()=>{
  let code=typeof prompt==="function"?prompt("粘贴道具交换码："):"";
  if(code)importGift(code);
 });
 addBtn("返回",()=>mainStep0());
}
</script>
<script>
//==== main.js：游戏入口 ====

//开局
function startGame(){
 document.getElementById("logbox").innerHTML="";
 // 有存档先问去向（修复：onload 无条件新开局，误触保存即覆盖旧档）
 let hasAny=false;
 for(let n=1;n<=(typeof SAVE_SLOTS!=="undefined"?SAVE_SLOTS:6);n++){if(localStorage.getItem("mud_save_slot_"+n)){hasAny=true;break;}}
 if(localStorage.getItem("mud_save"))hasAny=true;
 if(hasAny){
  log("检测到已有存档。");
  addBtn("📖继续上次存档",()=>{document.getElementById("logbox").innerHTML="";loadLatest();});
  addBtn("🌱重新开局（旧档保留，保存时覆盖）",()=>{document.getElementById("logbox").innerHTML="";newGameStart();});
  return;
 }
 newGameStart();
}
function newGameStart(){
 document.getElementById("logbox").innerHTML="";
 showPortrait("hero","主角·长生者"); // 开局立绘（seedream 内嵌）
 log("===觉醒长生系统===");
 log("你从沉睡中苏醒，脑海响起冰冷系统声音：");
 log("【长生系统绑定成功，宿主获得无限寿命。只要活下去，时间会带给你无尽修为。】");
 log("乱世修仙界。妖魔横行，宗门林立，无数人求长生而不得。而你，天生不死。\n");
 bioLog("觉醒长生","长生系统绑定，获得无限寿命，踏上无尽岁月。"); // P6 传记
 if(gs.ng===0&&gs.stone===100&&typeof diffInitStone==="function")gs.stone=diffInitStone(); // P6 难度初始灵石（仅全新开局）
 addAch("a1");
 gainEquip(allEquip[0]);
 refreshUi();
 chooseTalent(); // P3b：命格三选一
}

//==== 命格三选一（P3b：开局觉醒，互斥）====
function chooseTalent(){
 log("\n【命格觉醒】冥冥之中，你感应到命格在呼唤，只能择一。","gold");
 let pool=Object.keys(TALENTS);
 let picks=[];
 while(picks.length<3&&pool.length){
  let i=Math.floor(Math.random()*pool.length);
  picks.push(pool.splice(i,1)[0]);
 }
 for(let id of picks){
  let t=TALENTS[id];
  addBtn(`【${id}】——${t.desc}`,()=>{
   gs.talent=id;
   bioLog("命格觉醒",`觉醒命格【${id}】。`); // P6 传记
   log(`你觉醒了命格【${id}】！`,"gold");
   refreshUi();
   mainStep0();
  });
 }
}

window.onload=startGame;
</script>
